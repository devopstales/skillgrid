# Research State — Central Project Tracking
# Copy to the run folder ({specs_root}/YYYY-MM-DD-<topic>/) at bootstrap.
# Updated by the agent after every inner-loop experiment and outer-loop reflection.
# This file is the resume handle: read it at session/compaction start before acting.

project:
  title: ""
  question: ""                  # The core research question, one sentence
  status: active                # active | paused | concluded
  started: ""                   # ISO date
  domain: ""                    # e.g. "vector indexing", "embedding models"
  type: ""                      # technical | competitive | domain (see skillgrid:research type packs)

literature:
  key_sources: []
  # - id: ""
  #   title: ""
  #   publisher: ""
  #   pub_date: ""
  #   relevance: ""
  open_problems: []             # Gaps identified from the literature
  evidence_gaps: []             # What's missing in the field

hypotheses:
  # All hypotheses, active and completed. Each must be testable with a clear prediction.
  # - id: H1
  #   statement: "Testable claim with a clear prediction"
  #   status: pending           # pending | active | supported | refuted | inconclusive
  #   motivation: "Why this is worth testing"
  #   parent: null              # null for root, parent id (e.g. H1) for sub-hypotheses
  #   priority: medium          # high | medium | low

experiments:
  proxy_metric: ""              # What is being optimized/observed and how to compute it
  baseline_value: null          # Starting point
  best_value: null              # Best achieved so far
  total_runs: 0
  trajectory: []
  # - run_id: "run_001"
  #   hypothesis: "H1"
  #   metric_value: null
  #   delta: null               # Change from baseline
  #   wall_time_min: null
  #   change_summary: ""
  #   classification: confirmatory   # confirmatory (in protocol) | exploratory (discovered)
  #   timestamp: ""

outer_loop:
  cycle: 0                      # How many outer-loop reflections so far
  last_direction: null          # deepen | broaden | pivot | conclude
  last_reflection: ""           # Brief summary of last reflection decision

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
