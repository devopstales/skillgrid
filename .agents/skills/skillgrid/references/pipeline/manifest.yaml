phase_0_intake:
  label: "Phase 0: Intake"
  prompt: "references/prompts/intake.md"
  references:
    - "references/specialists/prior-art.md"
    - "references/patterns/index.md"
    - "references/roles/panel.md"
    - "references/pipeline/onboarding.md"
    - "references/pipeline/onboarding-write.md"
  gate: "intake"
  outputs:
    - ".skillgrid/config.yaml"
    - ".skillgrid/state.yaml"
    - ".skillgrid/projectwiki/ASSUMPTIONS.md"
    - ".skillgrid/projectwiki/index.md"
    - ".skillgrid/change-specs/<topic>/briefing.md"
    - ".skillgrid/change-specs/<topic>/adr.md"
    - ".skillgrid/change-specs/<topic>/findings.md"
  next: "Phase 1: Foundation"

phase_1_foundation:
  label: "Phase 1: Foundation"
  prompt: "references/prompts/foundation.md"
  references:
    - "references/specialists/domain-foundation.md"
    - "references/specialists/consistency.md"
  gate: "foundation"
  outputs:
    - ".skillgrid/projectwiki/glossary/01-business-terms.md"
    - ".skillgrid/projectwiki/glossary/02-technical-terms.md"
    - ".skillgrid/projectwiki/invariants/05-locked-constraints.md"
    - ".skillgrid/projectwiki/entities/"
    - ".skillgrid/projectwiki/concepts/"
    - ".skillgrid/projectwiki/decisions/NNNN-slug.md"
    - ".skillgrid/projectwiki/index.md"
    - ".skillgrid/change-specs/<topic>/findings.md"
  next: "Phase 2: Architecture"

phase_2_architecture:
  label: "Phase 2: Architecture"
  prompt: "references/prompts/architecture.md"
  references:
    - "references/patterns/structure-and-risk.md"
    - "references/specialists/domain-foundation.md"
    - "references/specialists/consistency.md"
  gate: "blueprint-validation"
  outputs:
    - ".skillgrid/change-specs/<topic>/blueprint.md"
  next: "Phase 3: Drafting"

phase_3_drafting:
  label: "Phase 3: Drafting"
  prompt: "references/prompts/drafting.md"
  references:
    - "references/specialists/code-craft.md"
    - "references/patterns/code-patterns.md"
    - "references/roles/blind-reviewer.md"
    - "references/roles/panel.md"
    - "references/specialists/consistency.md"
    - "references/specialists/fix-editor.md"
  gate: "user-gate-slice"
  outputs:
    - ".skillgrid/change-specs/<topic>/acceptance.feature"
    - ".skillgrid/change-specs/<topic>/tasks.md"
    - ".skillgrid/work/<YYYY-MM-DD-topic>/progress.md"
    - "the working tree"
  next: "Phase 4: Adversarial Audit"

phase_4_adversarial_audit:
  label: "Phase 4: Adversarial Audit"
  prompt: "references/prompts/adversarial-audit.md"
  references:
    - "references/roles/auditor.md"
    - "references/specialists/consistency.md"
  gate: "qa-verdict"
  outputs:
    - ".skillgrid/change-specs/<topic>/report.md"
    - ".skillgrid/change-specs/<topic>/review.md"
  next: "Phase 5: Revision Loop"

phase_5_revision_loop:
  label: "Phase 5: Revision Loop"
  prompt: "references/prompts/revision-loop.md"
  references:
    - "references/scoring/evaluator-protocol.md"
    - "references/scoring/program-score.md"
    - "references/roles/panel.md"
    - "references/specialists/fix-editor.md"
    - "references/specialists/code-craft.md"
  gate: ""
  outputs:
    - ".skillgrid/change-specs/<topic>/review.md"
    - ".skillgrid/change-specs/<topic>/report.md"
  next: "Phase 6: Final Score"

phase_6_final_score:
  label: "Phase 6: Final Score"
  prompt: "references/scoring/program-score.md"
  references:
    - "references/scoring/evaluator-protocol.md"
    - "references/roles/panel.md"
  gate: ""
  outputs:
    - ".skillgrid/change-specs/<topic>/report.md"
  next: "Phase 7: Editorial Package"

phase_7_editorial_package:
  label: "Phase 7: Editorial Package"
  prompt: "references/prompts/editorial-package.md"
  references:
    - "references/specialists/release.md"
    - "references/specialists/prior-art.md"
    - "references/roles/panel.md"
  gate: "ship-decision"
  outputs:
    - ".skillgrid/change-archive/<topic>/report.md"
    - "README.md"
    - "CHANGELOG.md"
  next: ""
