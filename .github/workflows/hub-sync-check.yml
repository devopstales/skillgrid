name: Hub sync + hook tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sync-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify IDE mirrors match canonical prompts and agents
        run: node ./scripts/sync-ide-assets.mjs --check
      - name: Test the guard hooks
        run: node ./scripts/test-hooks.mjs

  skill-hygiene:
    # Runs on every PR (cheap, ~1s); the skills only change via PRs, so this is
    # enough — no path filter needed and it catches accidental edits too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skill hygiene guard (anatomy + line budgets + hot paths)
        run: node scripts/check-skillgrid-skills.mjs

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build and test mnemonic
        working-directory: mnemonic
        run: |
          go vet ./...
          go build ./...
          go test ./...
      - name: Build and test skillgrid-cli
        working-directory: skillgrid-cli
        run: |
          go vet ./...
          go build ./...
          go test ./...
