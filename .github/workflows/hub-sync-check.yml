name: Hub sync + hook tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sync-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify IDE mirrors match canonical prompts and agents
        run: ./scripts/sync-ide-assets.sh --check
      - name: Test the guard hooks
        run: ./scripts/test-hooks.sh
