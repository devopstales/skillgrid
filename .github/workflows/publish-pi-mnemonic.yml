name: Publish pi-mnemonic to GitHub Packages

on:
  push:
    tags:
      - "plugins/pi/mnemonic/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry: https://npm.pkg.github.com
      - name: Publish @devopstales/skillgrid-pi-mnemonic
        working-directory: plugins/pi/mnemonic
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
