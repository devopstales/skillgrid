baseURL = "https://devopstales.github.io/skillgrid/"
title = "skillgrid"
locale = "en-us"
enableRobotsTXT = true
timeZone = "UTC"
ignoreLogs = ["warning-goldmark-raw-html", "WARN  deprecated"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
description = "Agentic engineering for AI-assisted development: four verbs, one loop, files not chat."
repo = "https://github.com/devopstales/skillgrid"
repoLabel = "github.com/devopstales/skillgrid"
install = "npx skills@latest add devopstales/skillgrid"
brand = "skillgrid"
accent = "#6EE7A0"
footerNote = "© 2026 devopstales"

[outputs]
home = ["html", "rss"]
