<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} · Agentic engineering{{ else }}{{ .Title }} · skillgrid{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="theme-color" content="#020013">
  <link rel="icon" type="image/png" href="{{ "img/favicon.png" | relURL }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="skillgrid" href="{{ .Permalink }}">{{ end }}
  <link rel="preload" href="{{ "font/geist-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "main.css" | relURL }}">
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
<script src="{{ "main.js" | relURL }}"></script>
</body>
</html>
