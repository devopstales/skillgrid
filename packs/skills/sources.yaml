# Skillgrid upstream skill sources — consumed by `aiskillgrid install` (slice B+).
# Docs: docs/05-skills.md
#
# Strategy: curate + compose; do not vendor upstream trees.
# Plans / specs / tasks: Superpowers only (docs/superpowers, .superpowers).
# OpenSpec and Backlog.md are NOT in the default stack (deferred / out of scope).

version: 1
profile: default

plans_specs_tasks:
  owner: superpowers
  paths:
    - docs/superpowers/
    - .superpowers/
  notes: "Single source of truth — do not install OpenSpec or Backlog.md"

persistence:
  # Engram for cross-session memory; Superpowers files for git-visible plans/specs/tasks
  memory: engram
  artifacts_on_disk: superpowers

policy:
  invoke_gentle_ai_installer: false
  prefer_single_install_path: true
  superpowers_install: plugin # native plugin for all agents; do not also skills add
  karpathy_install: rules_and_skill # skill + always-on rules for all agents
  mattpocock_setup:
    once_per_repo: true
    preferred_tracker: local_files # Superpowers docs / GitHub issues — not Backlog.md

sources:
  - id: superpowers
    repo: obra/superpowers
    role: process_spine_and_artifacts
    selection: curated
    install: plugin
    skills: []
    notes: "Install as native plugin per agent (not skills add). Winner for brainstorm→plan→TDD→debug→verify AND plans/specs/tasks on disk"

  - id: karpathy
    repo: multica-ai/andrej-karpathy-skills
    role: coding_discipline
    selection: curated
    install: rules_and_skill
    skills:
      - karpathy-guidelines
    notes: "Copy skill + rules into every selected agent on install (Think / Simplicity / Surgical / Goal-driven)"

  - id: mattpocock
    repo: mattpocock/skills
    role: engineering
    selection: curated
    skills:
      - setup-matt-pocock-skills
      - grill-me
      - grill-with-docs
      - ask-matt
      - triage
      - improve-codebase-architecture
      - to-spec
    exclude_as_auto_invokers:
      - tdd
      - diagnosing-bugs
    notes: "After install, run /setup-matt-pocock-skills once per repo; tracker = local files / GitHub"

  - id: engram
    repo: Gentleman-Programming/engram
    role: memory_and_habits
    selection: curated
    required_when_engram_wired:
      - memory-protocol
    skills:
      - memory-protocol
      - commit-hygiene
      - docs-alignment
      - architecture-guardrails
      - branch-pr
    exclude_default:
      - dashboard-htmx
      - visual-language
      - gentleman-bubbletea
      - ui-elements
      - tui-quality
      - server-api
      - plugin-thin
      - project-structure
      - business-rules
      - cultural-norms
      - sdd-flow # would compete with Superpowers plans/specs
      - testing-coverage
      - backlog-triage
      - pr-review-deep
      - issue-creation
    notes: "memory-protocol required; sdd-flow excluded — Superpowers owns plans/specs/tasks"

  - id: gentle-ai
    repo: Gentleman-Programming/gentle-ai
    role: pr_issue_rdd
    selection: curated
    skills:
      - chained-pr
      - work-unit-commits
      - comment-writer
      - systemic-issue-triage
      - issue-root-resolution
      - rdd-defect-workflow
      - rdd-advisory-transport
      - cognitive-doc-design
    exclude_default:
      - branch-pr # Engram branch-pr wins
      - gentle-ai-bench
      - gentle-ai-collab-perfect
    notes: "Skills only — never gentle-ai install; do not use for OpenSpec/hybrid SDD"

conflicts:
  - intent: process_spine
    winner: superpowers
  - intent: plans_specs_tasks
    winner: superpowers
  - intent: coding_discipline
    winner: karpathy
  - intent: domain_grill
    winner: mattpocock
  - intent: memory
    winner: engram/memory-protocol
  - intent: tdd
    winner: superpowers/test-driven-development
  - intent: debugging
    winner: superpowers/systematic-debugging
  - intent: branch_pr
    winner: engram/branch-pr
  - intent: issue_triage
    winner: mattpocock/triage
