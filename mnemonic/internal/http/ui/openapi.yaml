  /tracker/providers:
    get:
      tags: [tracker]
      operationId: trackerProviders
      summary: Active tracker provider + whether its CLI is connected
      description: |-
        Reports the resolved provider (never guessed — 501 when unresolvable) and
        whether a CLI-backed provider's binary is on PATH. File-based Backlog.md is
        always connected:true. The UI uses connected:false to show a "not connected"
        empty state instead of a perpetual spinner.
      responses:
        "200":
          description: Provider status
          content:
            application/json:
              schema:
                type: object
                required: [provider, connected]
                properties:
                  provider:
                    type: string
                  connected:
                    type: boolean
                  reason:
                    type: string
                  cli:
                    type: string
              example:
                provider: backlogmd
                connected: true
                reason: ""
                cli: ""
        "501":
          $ref: "#/components/responses/Bad"
  /tracker/config:
    get:
      tags: [tracker]
      operationId: trackerConfig
      summary: Active tracker provider with its statuses, types, and priorities
      description: |-
        Resolved from SKILLGRID_TRACKER, docs/skillgrid/agents/issue-tracker.md,
        then config.yaml (default backlogmd). 501 when unresolvable, 503 when the
        provider CLI is missing, 502 on CLI failure.
      responses:
        "200":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerConfig"
              example:
                provider: backlogmd
                statuses: [needs-triage, ready-for-agent, done]
                types: [feature, bug, chore]
                priorities: [high, medium, low]
                schema_version: "1"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /tracker/tasks:
    get:
      tags: [tracker]
      operationId: trackerList
      summary: List tracker items as normalized DTOs
      responses:
        "200":
          description: Normalized item list with provider name
          content:
            application/json:
              schema:
                type: object
                required: [tasks, provider]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackerItem"
                  provider:
                    type: string
              example:
                provider: backlogmd
                tasks:
                  - id: TASK-001
                    title: Fix login
                    status: needs-triage
                    type: feature
                    priority: high
                    ac_completed: 1
                    ac_total: 4
                    is_ready: true
                    provider: backlogmd
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /tracker/tasks/{id}:
    get:
      tags: [tracker]
      operationId: trackerGet
      summary: One tracker item as a normalized DTO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
    post:
      tags: [tracker]
      operationId: trackerSetStatus
      summary: Change an item's status (provider-native, write-gated)
      description: |-
        Backlog.md runs `task edit -s`; GitHub/GitLab close/reopen; Jira runs
        `issue move`. Requires the bearer token when SKILLGRID_HTTP_TOKEN is set.
        400 on a status outside the provider set, 501 where the provider has no
        equivalent transition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
            example:
              status: ready-for-agent
      responses:
        "200":
          description: Updated normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [tracker]
      operationId: trackerPatch
      summary: Update an item's status (the Phase 2 write path, write-gated)
      description: |-
        PATCH /tracker/tasks/{id} with {"status": ...} → SetStatus. Same semantics
        as POST .../status but using the HTTP PATCH verb. Requires the bearer token
        when SKILLGRID_HTTP_TOKEN is set. 400 on a status outside the provider set,
        501 where the provider has no equivalent transition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
            example:
              status: ready-for-agent
      responses:
        "200":
          description: Updated normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /tracker/tasks/{id}/deps:
    get:
      tags: [tracker]
      operationId: trackerDeps
      summary: Dependency edges for one task (the Kanban dependency mini-graph)
      description: |-
        Backlog.md computes deps from the frontmatter `dependencies` list across all
        tasks. GitHub/GitLab/Jira expose no native edges here, so they return empty
        (the board still renders). 404 for an unknown task id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dependency edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerDeps"
              example:
                task_id: TASK-001
                deps_in: [TASK-002]
                deps_out: []
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
  /tracker/stream:
    get:
      tags: [tracker]
      operationId: trackerStream
      summary: Live task-change events (SSE)
      description: |-
        Server-sent events on .backlog/tasks/ changes (fsnotify). Emits an initial
        "ready" event, then a "tasks-changed" event whenever a task file is
        written/created/removed/renamed. The Kanban board live-updates from this
        stream without a manual reload. Clients are cleaned up on disconnect
        (no goroutine leak).
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
  /backlog/config:
    get:
      tags: [tracker]
      operationId: backlogConfigAlias
      summary: Alias of GET /tracker/config on Backlog.md repos (else 501)
      responses:
        "200":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerConfig"
        "501":
          $ref: "#/components/responses/Bad"
  /backlog/tasks:
    get:
      tags: [tracker]
      operationId: backlogListAlias
      summary: Alias of GET /tracker/tasks on Backlog.md repos (else 501)
      responses:
        "200":
          description: Normalized item list with provider name
          content:
            application/json:
              schema:
                type: object
                required: [tasks, provider]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackerItem"
                  provider:
                    type: string
        "501":
          $ref: "#/components/responses/Bad"
  /backlog/tasks/{id}:
    get:
      tags: [tracker]
      operationId: backlogGetAlias
      summary: Alias of GET /tracker/tasks/{id} on Backlog.md repos (else 501)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
  /docs/changes:
    get:
      tags: [docs]
      operationId: docsList
      summary: List SDD changes (name, status, ticket id)
      description: |-
        Read-only view of docs/skillgrid/changes and docs/skillgrid/archive.
        The ticket id is parsed from each change.md `Ticket:` line (backticks
        and annotations stripped by the UI, not here).
      responses:
        "200":
          description: Change list
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocChange"
              example:
                changes:
                  - name: 009-web-admin-dashboard
                    status: in-progress
                    ticket: TASK-001
                  - name: 004-hermes-memory
                    status: draft
                    ticket: "task-001"
        "500":
          $ref: "#/components/responses/Internal"
  /docs/changes/{name}:
    get:
      tags: [docs]
      operationId: docsGet
      summary: One change's change.md + tasks.md text
      description: |-
        Sandboxed to the two docs roots: names with `..`, absolute paths, or
        escapes return 400; unknown names return 404. Read-only — files are
        served as text, never executed.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: 009-web-admin-dashboard
      responses:
        "200":
          description: Change documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocChangeDetail"
              example:
                name: 009-web-admin-dashboard
                status: in-progress
                ticket: TASK-001
                change_md: "# Change: 009-web-admin-dashboard\n\n**Ticket:** TASK-001\n"
                tasks_md: "# Tasks: 009-web-admin-dashboard\n"
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /docs/tree:
    get:
      tags: [docs]
      operationId: docsTree
      summary: Grouped markdown doc tree across the declared roots
      description: |-
        Read-only tree of markdown files under `.skillgrid/{specs,adr,prd}` (skillgrid),
        `openspec/`, `specs/` + `.specify/memory` (speckit),
        `docs/superpowers/plans|specs` (superpowers), `.backlog/tasks/` (backlog),
        `docs/` (docs), and top-level root `*.md`. Every path is sandboxed (clean +
        prefix-checked). The SPA renders; the server never executes markdown.
      parameters:
        - name: root
          in: query
          required: false
          schema:
            type: string
            enum: [skillgrid, openspec, speckit, superpowers, backlog, docs, all]
            default: all
          description: Which doc method's artifacts to include. `all` (default) includes every method whose directories exist in the repo (skillgrid, openspec, speckit, superpowers, backlog, docs).
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required: [root, nodes]
                properties:
                  root: { type: string }
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocsTreeNode"
              example:
                root: all
                nodes:
                  - dir: true
                    name: backlog
                    path: backlog/.backlog/tasks
                    children:
                      - dir: false
                        name: TASK-001-something.md
                        path: .backlog/tasks/TASK-001-something.md
                        title: Task one
                        status: in-progress
        "400":
          $ref: "#/components/responses/Bad"
  /docs/content:
    get:
      tags: [docs]
      operationId: docsContent
      summary: One markdown doc's raw body + frontmatter + related plans
      description: |-
        Returns the file body (for client-side render + sanitize), any YAML
        frontmatter, cross-referenced plan names, the mermaid render config
        (securityLevel: strict), and mtime. Sandboxed: raw `..`/absolute paths
        are 400, clean-but-absent paths are 404.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          example: .backlog/tasks/TASK-001-something.md
      responses:
        "200":
          description: Doc content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocsContent"
              example:
                path: .backlog/tasks/TASK-001-something.md
                title: Task one
                frontmatter: { id: TASK-001, status: in-progress, priority: high }
                body: "# Task one\n\nBody.\n"
                relatedPlans: []
                updatedAt: "2026-09-08T00:00:00Z"
                mermaid: { securityLevel: strict }
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /docs/search:
    get:
      tags: [docs]
      operationId: docsSearch
      summary: Case-insensitive search across all markdown docs
      description: |-
        Returns matching docs with a short snippet around the first match.
        Scans every declared root plus top-level root `*.md`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          example: Briefing
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [q, results]
                properties:
                  q: { type: string }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocsSearchHit"
              example:
                q: Briefing
                results:
                  - path: .skillgrid/specs/009-web-admin-dashboard/briefing.md
                    title: Briefing
                    snippet: "…# Briefing …"
                    root: skillgrid
  /docs/render:
    get:
      tags: [docs]
      operationId: docsRender
      summary: Server-side rendered HTML fallback for a doc
      description: |-
        Conservative, dependency-free markdown→HTML (escaped; headings,
        paragraphs, lists). The primary path renders client-side; this is an SSR
        fallback. Same sandboxing as /docs/content.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          example: README.md
      responses:
        "200":
          description: Rendered HTML
          content:
            text/html: {}
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /mnemonic/graph/data:
    get:
      tags: [mnemonic-graph]
      operationId: mnemonicGraph
      summary: Code/memory vector graph (nodes + edges)
      description: |-
        Returns the project's symbol graph as a flat {nodes, edges} payload for
        the Sigma.js frontend. Nodes carry id/label/type/path/degree/community;
        edges carry source/target/type/weight/directed/confidence.

        With `node_id` + `depth`, returns the depth-hop neighborhood of that
        symbol (BFS, undirected) and sets `truncated` when the bound dropped
        edges. Without `node_id`, returns the full graph (capped at `limit`).

        `degraded` is true when no edge/community data is present (the 005/008
        soft dependency is absent): the response then carries a `files` list so
        the UI can fall back to a node-only + file-list view.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: node_id
          in: query
          required: false
          schema: { type: integer }
          example: 42
          description: Symbol id to center a depth-limited neighborhood on.
        - name: depth
          in: query
          required: false
          schema: { type: integer, default: 2 }
          example: 2
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5000 }
          example: 5000
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/GraphNode" }
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/GraphEdge" }
                  truncated: { type: boolean }
                  degraded: { type: boolean }
                  files:
                    type: array
                    items: { type: string }
                  project: { type: string }
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Bad"
  /mnemonic/graph/nodes:
    get:
      tags: [mnemonic-graph]
      operationId: mnemonicGraphNodes
      summary: Graph node list (capped)
      description: |-
        Returns symbol nodes (id/label/type/path/degree/community) without
        edges, capped at `limit`. Sets `truncated` when the cap dropped nodes
        and `total` for the uncapped count.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5000 }
          example: 500
      responses:
        "200":
          description: Node payload
          content:
            application/json:
              schema:
                 type: object
                 properties:
                   nodes:
                     type: array
                     items: { $ref: "#/components/schemas/GraphNode" }
                   truncated: { type: boolean }
                   total: { type: integer }
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Bad"
  /mnemonic/files/tree:
    get:
      tags: [mnemonic-files]
      operationId: mnemonicFilesTree
      summary: OpenViking file tree
      description: |-
        Returns the OpenViking tree derived from observations.topic_key for the
        project, with per-node memory_count (live observations under the prefix)
        and last_indexed (newest created_at). `path` scopes the walk to a
        topic_key prefix.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: path
          in: query
          required: false
          schema: { type: string }
          example: arch
      responses:
        "200":
          description: File tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  root: { $ref: "#/components/schemas/FileTreeNode" }
                  nodes: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/files/content:
    get:
      tags: [mnemonic-files]
      operationId: mnemonicFilesContent
      summary: OpenViking L0/L1/L2 content tiers
      description: |-
        Returns the L0 (abstract), L1 (overview), and L2 (details) content tiers
        for a topic_key. `uri` is a mnemonic:// URI whose final path segment is
        the topic key.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: uri
          in: query
          required: true
          schema: { type: string }
          example: "mnemonic://arch"
      responses:
        "200":
          description: Content tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  uri: { type: string }
                  project: { type: string }
                  l0: { $ref: "#/components/schemas/FileContentTier" }
                  l1: { $ref: "#/components/schemas/FileContentTier" }
                  l2: { $ref: "#/components/schemas/FileContentTier" }
        "400": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/memories:
    get:
      tags: [mnemonic-memories]
      operationId: mnemonicMemories
      summary: Paginated memory list
      description: |-
        Returns a paginated list of observations, pinned first, newest first.
        Each row carries the 013 asset fields (owner/visibility/status) when
        present.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Memory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  memories:
                    type: array
                    items: { $ref: "#/components/schemas/MemorySummary" }
        "400": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/memories/{id}:
    get:
      tags: [mnemonic-memories]
      operationId: mnemonicMemoryDetail
      summary: Memory detail + 013 governance
      description: |-
        Returns the full, untruncated observation plus the 013 governance
        overlay (owner/versions/status/retrieval_usage/visibility + ACL grants).
        When 013 is absent, the governance fields stay zero/empty and
        `governance` is false (forward-compat).
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Memory detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "400": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
    put:
      tags: [mnemonic-memories]
      operationId: mnemonicMemoryEdit
      summary: Edit a memory (write-gated)
      description: |-
        Write-gated (Bearer token) edit of a memory's content/title. The 013
        service layer appends an observation_version before rewriting; when 013
        is absent it rewrites in place.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                title: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  updated: { type: boolean }
                  revision: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }
        "401": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/memories/{id}/share:
    post:
      tags: [mnemonic-memories]
      operationId: mnemonicMemoryShare
      summary: Change memory visibility (write-gated)
      description: |-
        Write-gated (Bearer token) visibility change (team|restricted|agent).
        Idempotent; an unknown target is a 400.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { type: string, enum: [team, restricted, agent] }
                grants:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Shared
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  visibility: { type: string }
        "400": { $ref: "#/components/responses/Bad" }
        "401": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/memories/{id}/status:
    post:
      tags: [mnemonic-memories]
      operationId: mnemonicMemoryStatus
      summary: Set memory lifecycle status (write-gated)
      description: |-
        Write-gated (Bearer token) lifecycle status change
        (active|superseded|archived). Unknown status is a 400.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, superseded, archived] }
      responses:
        "200":
          description: Status set
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string }
        "400": { $ref: "#/components/responses/Bad" }
        "401": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/sessions:
    get:
      tags: [mnemonic-sessions]
      operationId: mnemonicSessions
      summary: Mnemonic session browser
      description: |-
        Returns the project's sessions with derived memory_count and summary
        presence, newest first.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/MnemonicSession" }
        "400": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/audit:
    get:
      tags: [mnemonic-audit]
      operationId: mnemonicAudit
      summary: Hash-chained audit trail
      description: |-
        Returns the hash-chained audit trail over observation_versions (the
        append-only memory change log). Each entry's hash covers the previous
        hash + this entry's fields, so a tamper breaks the chain.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  chain_valid: { type: boolean }
        "400": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  /mnemonic/search:
    get:
      tags: [mnemonic-search]
      operationId: mnemonicSearch
      summary: Hybrid memory search
      description: |-
        Runs the memory search (default hybrid; `mode=fts` for the lexical leg)
        and returns ranked results with a 0..1 rank-derived relevance. An empty
        query returns 200 with an empty list.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
          example: auth
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [hybrid, fts], default: hybrid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Bad" }
  # ── Phase 8: Mnemonic decision bridge (change 2026-09-19-embed-visual-companion) ──
  /mnemonic/decisions:
    get:
      tags: [mnemonic-decisions]
      operationId: mnemonicDecisions
      summary: List the project's decision observations (the visual companion)
      description: |-
        Returns the project's type=decision observations (not deleted, never
        private) with their content parsed into a structured payload, ordered
        ascending by created_at (capped at 200 rows). `state` filters the
        convention state inside the content (pending|answered|superseded;
        `all` or omitted = every state); a row whose content is malformed is
        still returned, flagged parseError, and is only excluded by a
        specific state filter. `topic` is an optional topic_key prefix filter
        (the convention is interview/<slug>/<question-id>). The row's
        `status` column is governance (active|superseded|archived); pending /
        answered lives in the content JSON.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
          example: my-project
        - name: state
          in: query
          required: false
          description: Filter on the convention state inside the content.
          schema: { type: string, enum: [pending, answered, superseded, all] }
        - name: topic
          in: query
          required: false
          description: topic_key prefix filter (e.g. interview/<slug>/)
          schema: { type: string }
      responses:
        "200":
          description: Decision list (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DecisionRow" }
              example:
                - id: 12
                  topicKey: interview/demo/layout-1
                  title: "Decision: layout-1"
                  createdAt: "2026-09-19T00:00:00Z"
                  updatedAt: "2026-09-19T00:00:00Z"
                  visibility: team
                  content:
                    question: Which layout?
                    options:
                      - id: a
                        label: Single column
                      - id: b
                        label: Two column
                    recommended: a
                    state: pending
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /mnemonic/decisions/{id}/answer:
    post:
      tags: [mnemonic-decisions]
      operationId: mnemonicDecisionAnswer
      summary: Answer a decision (write-gated)
      description: |-
        Write-gated (Bearer token, SKILLGRID_HTTP_TOKEN) answer: flips the
        decision's convention state pending→answered, records the chosen
        option + note + updatedBy (user:<name>) in the content, and persists
        it through the same version-append path mem_update uses — an
        observation_versions row is appended and revision_count/updated_at
        bumped (durable, auditable). Re-answering an answered decision is a
        200: the state stays answered, the new answer is recorded, and another
        version is appended (the latest content carries the latest answer).
        400 for a missing/invalid project or id, a malformed body, or a
        missing optionId; 401 without the bearer token; 404 for an unknown id
        (or non-decision row); 409 for content with no valid state (missing,
        malformed, or unrecognized) or a superseded decision; 422 for an
        optionId not in the decision's options.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: Decision observation id (an integer) }
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: answerer
          in: query
          required: false
          description: Answerer name recorded as updatedBy (user:<name>; default "unknown")
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionAnswerInput" }
            example: { optionId: b, note: two column reads better }
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean }
                  state: { type: string, enum: [answered] }
              example: { ok: true, state: answered }
        "400": { $ref: "#/components/responses/Bad" }
        "401": { $ref: "#/components/responses/Bad" }
        "404": { $ref: "#/components/responses/Bad" }
        "409": { $ref: "#/components/responses/Bad" }
        "422": { $ref: "#/components/responses/Bad" }
        "500": { $ref: "#/components/responses/Internal" }
  /swagger-ui:
    get:
      tags: [ui]
      operationId: swaggerUI
      summary: Swagger UI (interactive API explorer)
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}
  /openapi.yaml:
    get:
      tags: [ui]
      operationId: openAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml: {}

  # --- Phase 6: activity / plans / git ---
  /activity/events:
    get:
      tags: [activity]
      operationId: activityEvents
      summary: Agent activity feed (newest first)
      description: |-
        Returns the project's agent activity (observations) newest first.
        There is no events table — activity is modeled as observations.
        limit is clamped to 1..500. Unknown project → 200 with an empty feed.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityEvent" }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }

  /activity/stats:
    get:
      tags: [activity]
      operationId: activityStats
      summary: Activity counters
      description: Total events, per-type breakdown, and active session count.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  total: { type: integer }
                  byType:
                    type: object
                    additionalProperties: { type: integer }
                  activeSessions: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }

  /activity/stream:
    get:
      tags: [activity]
      operationId: activityStream
      summary: Live activity stream (SSE)
      description: |-
        Server-Sent Events. Emits an initial `event: ready`, then an
        `event: activity` for each new observation (800ms poll). 15s
        heartbeat. Leak-free: the poller exits on client disconnect.
      parameters:
        - name: project
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Bad" }

  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: List SDD plans (from .skillgrid/specs)
      description: |-
        One card per .skillgrid/specs/<slug>/ directory: name, status (the
        `> **STATUS:**` blockquote line), checklist progress (done/total),
        and whether an SDD ledger exists. Newest date first.
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/PlanSummary" }

  /plans/{id}:
    get:
      tags: [plans]
      operationId: planDetail
      summary: Plan detail (status, progress, files, SDD ledger steps)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDetail" }
        "404":
          description: Unknown plan
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /specs:
    get:
      tags: [plans]
      operationId: listSpecs
      summary: List spec markdown files (for a UI file tree)
      responses:
        "200":
          description: Spec file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { type: string }

  /specs/{path...}:
    get:
      tags: [plans]
      operationId: specContent
      summary: Spec markdown content (sandboxed to .skillgrid/specs)
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Spec content
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  content: { type: string }
        "404":
          description: Unknown spec
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /git/commits:
    get:
      tags: [git]
      operationId: gitCommits
      summary: Commit log (newest first)
      description: git log with per-commit +/- stats and author. limit clamped 1..500. Not-a-repo → 503.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Commit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items: { $ref: "#/components/schemas/GitCommit" }
                  limit: { type: integer }
        "503":
          description: Not a git repository
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /git/commits/{sha}:
    get:
      tags: [git]
      operationId: gitCommit
      summary: Commit detail (metadata + changed files)
      parameters:
        - name: sha
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Commit detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCommit" }
        "404":
          description: Unknown commit
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
        "503":
          description: Not a git repository
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /git/diff/{sha}:
    get:
      tags: [git]
      operationId: gitDiff
      summary: Unified diff of a commit
      parameters:
        - name: sha
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha: { type: string }
                  diff: { type: string }
        "404":
          description: Unknown commit
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /git/file-history:
    get:
      tags: [git]
      operationId: gitFileHistory
      summary: Commit history for one file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File history
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/GitCommit" }
        "404":
          description: No history for path
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /git/blame:
    get:
      tags: [git]
      operationId: gitBlame
      summary: Per-line blame for one file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blame
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/GitBlameLine" }
        "404":
          description: Blame error / unknown path
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
  /prototypes:
    get:
      tags: [prototypes]
      operationId: prototypesList
      summary: List feasibility prototypes (.skillgrid/prototypes/)
      description: |-
        Lists the directories under .skillgrid/prototypes/ and extracts a light
        summary (date, type, hypothesis, file list) from each prototype.md.
        Directories without a prototype.md (WIP) are still listed so they are
        visible rather than silently dropped. Read-only; sorted by name.
      responses:
        "200":
          description: Prototype list
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    description: Root directory scanned (relative to the served repo)
                  count: { type: integer }
                  prototypes:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        date: { type: string }
                        venue: { type: string, description: "The prototype.md `Type:` header" }
                        hypothesis: { type: string }
                        change:
                          type: string
                          description: Change id (specs or archive) this prototype belongs to
                        files:
                          type: array
                          items: { type: string }
              example:
                source: ".skillgrid/prototypes"
                count: 1
                prototypes:
                  - name: "001-cgo-free-vector-db"
                    date: "2026-09-24"
                    venue: "comparison (G vs viant)"
                    hypothesis: "Given a Go module, when we adopt either, then both work."
                    files: ["g.go", "prototype.md"]
        "404":
          description: No .skillgrid/prototypes/ directory
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
  /prototypes/{name}/{file}:
    get:
      tags: [prototypes]
      operationId: prototypeFile
      summary: Serve one file from a feasibility prototype
      description: |-
        Serves one file under .skillgrid/prototypes/{name}/ so a generated
        index.html preview (and the relative assets it loads) can open in a
        new tab. Sandboxed to that directory: traversal or an absolute path
        → 400; a missing file or a directory → 404. Served with nosniff.
      parameters:
        - name: name
          in: path
          required: true
          description: Prototype directory name under .skillgrid/prototypes/
          schema: { type: string }
        - name: file
          in: path
          required: true
          description: File path relative to the prototype directory (e.g. index.html)
          schema: { type: string }
      responses:
        "200":
          description: The file, content type from its extension
          content:
            text/html:
              schema: { type: string }
              example: "<html></html>"
        "400":
          description: Invalid (traversal/absolute) path
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
        "404":
          description: Unknown file
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
  /prototype/{id...}:
    get:
      tags: [mnemonic-decisions]
      operationId: prototypeDecision
      summary: Serve one decision-companion prototype (sandboxed to .skillgrid/prototype)
      description: |-
        Serves the HTML of one visual-companion prototype, sandboxed to
        .skillgrid/prototype/ (a distinct subtree from the plural /prototypes
        above, which lists feasibility prototypes under
        .skillgrid/prototypes/). Traversal/absolute ids
        (.., leading /) → 400; unknown → 404. Served with nosniff; rendered
        client-side in a sandboxed iframe (sandbox="allow-scripts", no
        allow-same-origin) inside the decision card. Throwaway by design —
        the durable record is the decision observation + its version history.
      parameters:
        - name: id
          in: path
          required: true
          description: Prototype path relative to .skillgrid/prototype/ (e.g. <topic>/<variant>.html)
          schema: { type: string }
      responses:
        "200":
          description: Prototype HTML
          content:
            text/html:
              schema: { type: string }
              example: "<html><body><h1>Variant A</h1></body></html>"
        "400":
          description: Invalid (traversal/absolute) id
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
        "404":
          description: Unknown prototype
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
        "500": { $ref: "#/components/responses/Internal" }
components:
  responses:
    Bad:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPError"
    Internal:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPError"
  parameters:
    ToolAgent: { name: agent, in: query, schema: { type: string, example: cursor } }
    ToolAction:
      name: action
      in: query
      schema: { type: string, enum: [file_read, file_write, command_exec, tool_use] }
    ToolName: { name: tool, in: query, schema: { type: string } }
    ToolFile: { name: file, in: query, description: "path glob", schema: { type: string } }
    ToolCommand: { name: command, in: query, description: "command glob", schema: { type: string } }
    ToolSince: { name: since, in: query, description: "RFC3339 or 30m, 24h, 7d, 1w", schema: { type: string } }
  schemas:
    ToolEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string }
        sessionId: { type: string }
        sequence: { type: integer }
        agent: { type: string }
        action: { type: string }
        tool: { type: string }
        path: { type: string }
        command: { type: string }
        result: { type: string, description: "success, error, blocked, warned, or guided" }
        sensitive: { type: boolean }
        preview: { type: string }
        mcp: { type: boolean }
    HTTPError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    GraphNode:
      type: object
      properties:
        id: { type: integer, description: Symbol id (stable graph key) }
        uid: { type: string, description: Content-stable symbol UID }
        label: { type: string, description: Symbol name }
        type: { type: string, description: Symbol kind (function/method/class/...) }
        language: { type: string }
        path: { type: string, description: File path of the symbol }
        degree: { type: integer, description: Undirected degree (for sizing) }
        community:
          type: integer
          description: Leiden community id; -1 when community data is absent
    GraphEdge:
      type: object
      properties:
        id: { type: string, description: kind:from->to key }
        source: { type: integer }
        target: { type: integer }
        type: { type: string, description: Edge kind (calls/imports/extends/...) }
        weight: { type: number }
        directed: { type: boolean }
        confidence: { type: string, description: EXTRACTED / INFERRED / AMBIGUOUS }
    FileTreeNode:
      type: object
      properties:
        name: { type: string }
        path: { type: string, description: topic_key path for this node }
        leaf: { type: boolean, description: true when the node is a topic with observations }
        memory_count: { type: integer, description: live observations under this prefix }
        last_indexed: { type: string, description: newest created_at under this prefix }
        children:
          type: array
          items: { $ref: "#/components/schemas/FileTreeNode" }
    FileContentTier:
      type: object
      properties:
        label: { type: string, enum: [abstract, overview, details] }
        content: { type: string }
        count: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              type: { type: string }
              content: { type: string }
              created_at: { type: string }
    MemorySummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string }
        scope: { type: string }
        topic_key: { type: string }
        source: { type: string }
        owner: { type: string }
        visibility: { type: string }
        status: { type: string }
        pinned: { type: boolean }
        retrieval_usage: { type: integer }
        revision_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    MemoryDetail:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string }
        content: { type: string }
        scope: { type: string }
        topic_key: { type: string }
        source: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        pinned: { type: boolean }
        owner: { type: string }
        visibility: { type: string }
        status: { type: string }
        retrieval_usage: { type: integer }
        revision_count: { type: integer }
        versions:
          type: array
          items:
            type: object
            properties:
              revision: { type: integer }
              created_at: { type: string }
        grants:
          type: array
          items:
            type: object
            properties:
              grantee: { type: string }
              grant_type: { type: string }
        governance:
          type: boolean
          description: true when the 013 governance overlay was applied
    MnemonicSession:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        started_at: { type: string }
        ended_at: { type: string }
        status: { type: string }
        memory_count: { type: integer }
        observations:
          type: integer
          description: Count of non-deleted observations for the session (same value as memory_count)
        has_summary: { type: boolean }
    SessionObservationFeedItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        tokens: { type: integer, description: Heuristic token estimate (title + content) }
        pinned: { type: boolean }
    AuditEntry:
      type: object
      properties:
        seq: { type: integer }
        observation_id: { type: integer }
        revision: { type: integer }
        created_at: { type: string }
        hash: { type: string, description: sha256 over prev+fields }
        prev_hash: { type: string }
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string }
        scope: { type: string }
        topic_key: { type: string }
        source: { type: string }
        preview: { type: string }
        created_at: { type: string }
        relevance: { type: number, description: 0..1 rank-derived score }
    DecisionOption:
      type: object
      properties:
        id: { type: string, description: "Stable option id (a/b/…)" }
        label: { type: string }
        rationale: { type: string }
    DecisionContent:
      type: object
      required: [question, state]
      properties:
        question: { type: string, description: "The question, in domain language" }
        options:
          type: array
          items: { $ref: "#/components/schemas/DecisionOption" }
        recommended: { type: string, description: "Id of the agent-recommended option (highlighted in the UI)" }
        state: { type: string, enum: [pending, answered, superseded], description: "The convention state (a content field, not the governance status)" }
        answeredOption: { type: string, description: "Id of the option the user chose (set by the answer)" }
        answerNote: { type: string, description: "The user's answer note (set by the answer)" }
        updatedBy: { type: string, description: "Last writer, agent, or user:<name> after an answer" }
        visual: { type: string, description: "Prototype id <topic>/<variant>.html served from .skillgrid/prototype/ (GET /prototype/…); rendered in a sandboxed iframe when present" }
    DecisionRow:
      type: object
      required: [id, topicKey, title, createdAt, updatedAt, visibility, content]
      properties:
        id: { type: integer, format: int64 }
        topicKey: { type: string, description: "Convention topic_key interview/<slug>/<question-id>" }
        title: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        visibility: { type: string }
        content: { $ref: "#/components/schemas/DecisionContent" }
        parseError: { type: boolean, description: "True when the row's content is not valid decision JSON (the row is still returned, never a 500)" }
    DecisionAnswerInput:
      type: object
      required: [optionId]
      properties:
        optionId: { type: string, description: "Id of the option the user chose" }
        note: { type: string, description: "Optional answer note" }
    DocChange:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Change directory name (NNN-slug)
          example: 009-web-admin-dashboard
        status:
          type: string
          description: Parsed from the change.md `STATUS:` line (lowercased); "unknown" when absent
          example: in-progress
        ticket:
          type: string
          description: Parsed from the change.md `Ticket:` line; absent when the change has no ticket
          example: TASK-001
    DocChangeDetail:
      type: object
      required: [name, status, change_md]
      properties:
        name:
          type: string
        status:
          type: string
        ticket:
          type: string
          description: Absent when the change has no `Ticket:` line (the UI renders no tracker link, not an error)
        change_md:
          type: string
          description: Full change.md text
        tasks_md:
          type: string
          description: Full tasks.md text; absent when the change has no tasks.md
    DocsTreeNode:
      type: object
      required: [dir, name, path]
      properties:
        dir:
          type: boolean
        name:
          type: string
        path:
          type: string
          description: Repo-relative slash path
        title:
          type: string
        status:
          type: string
          description: Frontmatter status (leaf markdown files only)
        updated:
          type: string
          description: mtime, YYYY-MM-DD
        children:
          type: array
          items:
            $ref: "#/components/schemas/DocsTreeNode"
    DocsContent:
      type: object
      required: [path, body, mermaid]
      properties:
        path:
          type: string
        title:
          type: string
        frontmatter:
          type: object
          additionalProperties: { type: string }
          description: Parsed YAML frontmatter (flat key/value); absent when none
        body:
          type: string
          description: Markdown body (frontmatter stripped) — rendered + sanitized client-side
        relatedPlans:
          type: array
          items: { type: string }
          description: Other spec/change names referenced in the body
        updatedAt:
          type: string
          format: date-time
        mermaid:
          type: object
          required: [securityLevel]
          properties:
            securityLevel:
              type: string
              enum: [strict]
              description: SPA must render mermaid at this level (XSS-safe)
        docType:
          type: string
          enum: [task, doc, adr, prd, spec, note]
          description: Artifact type inferred from path + frontmatter; the SPA renders a schema-aware view
        decisionStatus:
          type: string
          description: ADR lifecycle status (proposed/accepted/rejected/superseded); present only for docType=adr
    DocsSearchHit:
      type: object
      required: [path]
      properties:
        path:
          type: string
        title:
          type: string
        snippet:
          type: string
          description: Short text around the first match
        root:
          type: string
    TrackerItem:
      type: object
      required: [id, title, status, board, provider]
      properties:
        id:
          type: string
          description: Provider-native identifier (TASK-001, 12, PROJ-1)
        title:
          type: string
        status:
          type: string
          description: Provider-native status
        status_detail:
          type: string
        description:
          type: string
          description: Item body (Backlog.md description, GitHub body, GitLab description)
        board:
          type: string
          description: Canonical kanban column (todo|in_progress|blocked|done) for one consistent board
          enum: [todo, in_progress, blocked, done]
        type:
          type: string
        priority:
          type: string
        assignees:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        doc_refs:
          type: array
          description: Linked document paths (used by the Docs entry)
          items:
            type: string
        dependencies:
          type: array
          description: Task ids this task depends on (edges out — the Kanban dependency mini-graph)
          items:
            type: string
        milestone:
          type: string
          description: Optional milestone label
        parent:
          type: string
          description: Optional parent task id (subtask linkage)
        due_date:
          type: string
          description: Optional due date (day, no time)
        ac_completed:
          type: integer
        ac_total:
          type: integer
        is_ready:
          type: boolean
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        provider:
          type: string
    TrackerDeps:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
        deps_in:
          type: array
          description: Tasks that depend on this one (its dependents)
          items:
            type: string
        deps_out:
          type: array
          description: Tasks this one depends on (its blockers)
          items:
            type: string
    TrackerConfig:
      type: object
      required: [provider, statuses]
      properties:
        provider:
          type: string
        statuses:
          type: array
