      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    SessionCreated:
      type: object
      required: [session_id, project_id]
      properties:
        session_id:
          type: string
        project_id:
          type: string
        title:
          type: string
          nullable: true
    Sessions:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionListItem"
    SessionListItem:
      type: object
      required: [id, started_at, status]
      properties:
        id:
          type: string
          description: Session UUID
        title:
          type: string
          description: Session name; empty when the session was never named
        started_at:
          type: string
          description: RFC3339 start time
        status:
          type: string
          enum: [active, ended]
    CheckpointClaimResponse:
      type: object
      required: [due, reason, prompt]
      properties:
        due:
          type: boolean
          description: True when a checkpoint prompt should be shown to the host agent.
        reason:
          type: string
          description: Empty when due; otherwise below_min_events, cooldown, disabled, or unknown_session.
        prompt:
          type: string
          description: Non-empty only when due is true — follow-up text for mem_save and mem_session_summary.
    SessionSummary:
      type: object
      required: [id, summary, status, ended_at]
      properties:
        id:
          type: string
          description: Session UUID
        summary:
          type: string
          description: End-of-session summary (markdown, rendered by the UI)
        status:
          type: string
          enum: [active, ended]
        ended_at:
          type: string
          description: RFC3339 end time; empty while the session is active
    Session:
      type: object
      properties:
        id:
          type: string
        project:
          type: string
        directory:
          type: string
        title:
          type: string
          nullable: true
          description: Human-readable session name (optional); shown in the dashboard session list
        started_at:
          type: string
        ended_at:
          type: string
        summary:
          type: string
        status:
          type: string
    Observations:
      type: object
      required: [observations]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
    Observation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
        type:
          type: string
        title:
          type: string
        content:
          type: string
        project:
          type: string
        scope:
          type: string
        topic_key:
          type: string
        normalized_hash:
          type: string
        revision_count:
          type: integer
        owner:
          type: string
          description: Governing identity (013 step 01); absent when unset
        visibility:
          type: string
          description: 013 visibility (private by default)
          enum: [private, team, restricted, agent]
        status:
          type: string
          description: 013 lifecycle status
          enum: [active, superseded, archived]
        retrieval_usage:
          type: integer
          description: How often this observation was retrieved
        prompt_id:
          type: integer
          format: int64
          nullable: true
        pinned:
          type: boolean
          description: Local "sticky" marker; pinned observations sort first
        duplicate_count:
          type: integer
        last_seen_at:
          type: string
        expires_at:
          type: string
        tool_name:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    Relation:
      type: object
      required: [id, src_obs_id, dst_obs_id, relation, created_at]
      properties:
        id:
          type: integer
          format: int64
        src_obs_id:
          type: integer
          format: int64
        dst_obs_id:
          type: integer
          format: int64
        relation:
          type: string
          description: Relation type (extracted, inferred, relates_to, supports, conflicts_with)
        confidence:
          type: number
          format: double
          description: 0..1 confidence; absent when unscored
        reason:
          type: string
        created_at:
          type: string
    Governance:
      type: object
      required: [id, owner, visibility, status, revision_count, retrieval_usage, versions]
      properties:
        id:
          type: integer
          format: int64
        owner:
          type: string
        visibility:
          type: string
          enum: [private, team, restricted, agent]
        status:
          type: string
          enum: [active, superseded, archived]
        revision_count:
          type: integer
        retrieval_usage:
          type: integer
        versions:
          type: array
          description: Append-only content history; the latest revision is the live content
          items:
            type: object
            required: [revision, content, created_at]
            properties:
              revision:
                type: integer
              content:
                type: string
              created_at:
                type: string
        grants:
          type: array
          description: ACL grants (restricted/agent visibility)
          items:
            type: object
            required: [grantee, grant_type]
            properties:
              grantee:
                type: string
              grant_type:
                type: string
        restricted_no_grants:
          type: boolean
          description: True when visibility is restricted and no ACL grants exist (owner-only)
    ObservationInput:
      type: object
      required: [title, type, content, session_id]
      properties:
        title:
