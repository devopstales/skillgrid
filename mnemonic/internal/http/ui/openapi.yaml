openapi: 3.0.3
info:
  title: Skillgrid Mnemonic HTTP API
  description: |-
    Persistent memory, code index, and web research cache for AI agents.

    Write routes (POST) optionally require an `Authorization: Bearer <token>`
    header when the server is started with `SKILLGRID_HTTP_TOKEN` set.
    Most routes take a `project` query parameter naming the project store
    (see `GET /projects` for available IDs).
  version: "0.1.0"
servers:
  - url: /
tags:
  - name: health
  - name: session
  - name: memory
  - name: code
  - name: web
  - name: tracker
  - name: ui
  - name: mnemonic-graph
  - name: mnemonic-files
  - name: mnemonic-memories
  - name: mnemonic-sessions
  - name: mnemonic-audit
  - name: mnemonic-search
  - name: mnemonic-decisions
paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Health probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /projects:
    get:
      tags: [memory]
      operationId: listProjects
      summary: List project store IDs
      responses:
        "200":
          description: Project IDs
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      type: string
  /sessions:
    get:
      tags: [session]
      operationId: sessionList
      summary: List sessions for a project
      description: Open read for the P6 Sessions entry list. Returns every session for the project (id, title, started_at, status), newest first. The path-routed dashboard shell also serves this URL for HTML requests without ?project=.
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
              example:
                sessions:
                  - id: "3f2c9a1e-8b4d-4a6f-9c2e-1d5b7a9f0e3c"
                    title: "step06 probe"
                    started_at: "2026-09-11T12:00:00Z"
                    status: "active"
                  - id: "9b8c7d6e-5f4a-3b2c-1d0e-f0e1d2c3b4a5"
                    title: "step06 second"
                    started_at: "2026-09-11T11:00:00Z"
                    status: "ended"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [session]
      operationId: sessionCreate
      summary: Create a workspace session
      parameters:
        - name: directory
          in: query
          required: false
          description: Working directory for the session (defaults to `.`)
          schema:
            type: string
        - name: title
          in: query
          required: false
          description: Optional human-readable session name, shown in the web dashboard session list
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: string
                title:
                  type: string
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
              example:
                session_id: "3f2c9a1e-8b4d-4a6f-9c2e-1d5b7a9f0e3c"
                project_id: "skillgrid-v2"
                created: true
                title: "step06 probe"
        "500":
          $ref: "#/components/responses/Internal"
  /sessions/{id}/summary:
    get:
      tags: [session]
      operationId: sessionSummary
      summary: Get a session's stored summary (markdown)
      description: Open read for the P6 Sessions entry summary pane. Returns the session's summary, status, and ended_at; 404 for an unknown session id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
              example:
                id: "3f2c9a1e-8b4d-4a6f-9c2e-1d5b7a9f0e3c"
                summary: "## Goal\nWrap up the auth token rotation flow.\n\n## Key Learnings:\n1. Rotate atomically"
                status: "ended"
                ended_at: "2026-09-11T12:00:00Z"
        "404":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /sessions/{id}/activity:
    get:
      tags: [activity]
      operationId: sessionActivity
      summary: Activity feed scoped to one session
      description: |-
        The activity feed (observations) for a single session, newest first.
        Same shape as /activity/events but filtered by the {id} session
        (server-side scoping added in sessions-activity-unification). An id with
        no observations returns 200 with an empty events array (not 404).
        limit is clamped to 1..500.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Session-scoped activity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityEvent" }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/Bad" }
  /sessions/{id}/checkpoint/claim:
    post:
      tags: [session]
      operationId: sessionCheckpointClaim
      summary: Claim a memory checkpoint when due
      description: |-
        Host-agent hook (Cursor stop, OpenCode idle) asks whether a memory
        checkpoint is due for this session. Always returns 200 with a structured
        body — unknown sessions report `due: false` and `reason: unknown_session`.
        When `due` is true, the server stamps the claim before responding and
        returns a follow-up prompt for mem_save / mem_session_summary.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
        - { name: directory, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string }
                directory: { type: string }
      responses:
        "200":
          description: Claim decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointClaimResponse"
        "400": { $ref: "#/components/responses/Bad" }
  /sessions/{id}/tool-calls:
    post:
      tags: [session]
      operationId: sessionToolCall
      summary: Record one harness tool call
      description: |-
        Posted by the Cursor, OpenCode, and Kilo hooks after every tool call.
        Creates the session (tagged with agent) when it does not exist yet.
        Bumps the session's read, write, command, and error counters and
        appears on GET /activity/stream as a `tool` frame.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent: { type: string, example: cursor }
                directory: { type: string }
                type: { type: string, description: "file_read, file_write, shell, or other" }
                tool_name: { type: string }
                path: { type: string }
                command: { type: string }
                result_status: { type: string, example: success }
                content_hash: { type: string }
                content_preview: { type: string }
      responses:
        "200": { description: Recorded }
        "400": { $ref: "#/components/responses/Bad" }
  /sessions/{id}/events:
    get:
      tags: [session]
      operationId: sessionToolEvents
      summary: One session's tool-call timeline
      description: |-
        Harness tool calls for the session, newest first. Takes the same
        filters as GET /events. Sensitive paths keep their metadata but never
        return a preview. Policy decision rows (result blocked, warned, or
        guided) carry "rule: message" as the preview.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/ToolAgent" }
        - { $ref: "#/components/parameters/ToolAction" }
        - { $ref: "#/components/parameters/ToolName" }
        - { $ref: "#/components/parameters/ToolFile" }
        - { $ref: "#/components/parameters/ToolCommand" }
        - { $ref: "#/components/parameters/ToolSince" }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
      responses:
        "200":
          description: Tool events
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  sessionId: { type: string }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ToolEvent" }
                  observations:
                    type: array
                    description: Live observations for the session (pinned first, newest first)
                    items: { $ref: "#/components/schemas/SessionObservationFeedItem" }
        "400": { $ref: "#/components/responses/Bad" }
  /sessions/{id}/usage:
    post:
      tags: [session]
      operationId: sessionUsage
      summary: Report token usage for a session
      description: |-
        Token usage from the harness hooks. With total true the counts replace
        the session's totals (OpenCode and Kilo re-read their own message
        store); otherwise they are added. Cost comes from the pricing table
        (config.d/pricing.yaml); reported_cost is used only when the model is
        not priced. Cursor reports a model and no token counts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, example: claude-sonnet-4-5 }
                input: { type: integer, format: int64 }
                output: { type: integer, format: int64 }
                cache: { type: integer, format: int64 }
                total: { type: boolean }
                agent: { type: string }
                directory: { type: string }
                reported_cost: { type: number }
      responses:
        "200":
          description: The session's usage after the report
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: { type: string }
                  input_tokens: { type: integer, format: int64 }
                  output_tokens: { type: integer, format: int64 }
                  cache_tokens: { type: integer, format: int64 }
                  cost_usd: { type: number, nullable: true }
        "400": { $ref: "#/components/responses/Bad" }
  /events:
    get:
      tags: [session]
      operationId: toolEvents
      summary: Query tool calls across every session
      description: |-
        The Gryph-style query behind the Sessions filter bar and
        `skillgrid logs`. File and command filters are globs: * and ** match
        any run, ? matches one character.
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
        - { name: session, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/ToolAgent" }
        - { $ref: "#/components/parameters/ToolAction" }
        - { $ref: "#/components/parameters/ToolName" }
        - { $ref: "#/components/parameters/ToolFile" }
        - { $ref: "#/components/parameters/ToolCommand" }
        - { $ref: "#/components/parameters/ToolSince" }
        - { name: until, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
      responses:
        "200":
          description: Tool events, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ToolEvent" }
        "400": { $ref: "#/components/responses/Bad" }
  /events/stats:
    get:
      tags: [session]
      operationId: toolEventStats
      summary: Agent activity rollup
      description: |-
        Totals, per-action, per-agent, and per-model breakdowns, top files,
        commands, and tools, with token and cost totals. Policy decision rows
        count only toward blocked, warned, and guided.
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/ToolSince" }
        - { $ref: "#/components/parameters/ToolAgent" }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  since: { type: string }
                  total: { type: integer }
                  sessions: { type: integer }
                  mcp: { type: integer }
                  errors: { type: integer }
                  sensitive: { type: integer }
                  blocked: { type: integer }
                  warned: { type: integer }
                  guided: { type: integer }
                  byAction:
                    type: object
                    additionalProperties: { type: integer }
                  byAgent: { type: array, items: { type: object } }
                  byModel: { type: array, items: { type: object } }
                  topFiles: { type: array, items: { type: object } }
                  topCommands: { type: array, items: { type: object } }
                  topTools: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Bad" }
  /policy/evaluate:
    post:
      tags: [session]
      operationId: policyEvaluate
      summary: Evaluate the pre-tool policy for a pending call
      description: |-
        Called by the pre-tool hooks (ADR-0021). Loads .skillgrid/policy.yaml
        found from directory (or the project root) and ~/.skillgrid/policy.yaml;
        the first matching rule wins and no match allows. block, warn, and guide
        decisions are recorded on the session; a block bumps blocked_actions.
        A broken policy file answers allow with an error field (fail open).
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
                agent: { type: string }
                directory: { type: string }
                action: { type: string, enum: [file_read, file_write, command_exec, tool_use] }
                tool: { type: string }
                path: { type: string }
                command: { type: string }
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  effect: { type: string, enum: [block, warn, guide, allow] }
                  message: { type: string }
                  rule: { type: string }
                  action: { type: string }
                  recorded: { type: boolean }
                  error: { type: string }
        "400": { $ref: "#/components/responses/Bad" }
  /policy:
    get:
      tags: [session]
      operationId: policyGet
      summary: The merged pre-tool policy (read-only)
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
        - { name: directory, in: query, schema: { type: string } }
      responses:
        "200":
          description: Enabled flag, rules in evaluation order, and source files
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  enabled: { type: boolean }
                  rules: { type: array, items: { type: object } }
                  files: { type: array, items: { type: string } }
                  repoFile: { type: string }
                  error: { type: string }
  /sessions/{id}/end:
    post:
      tags: [session]
      operationId: sessionEnd
      summary: End a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  status:
                    type: string
        "500":
          $ref: "#/components/responses/Internal"
  /context:
    get:
      tags: [memory]
      operationId: context
      summary: Recent session context
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /memory/status:
    get:
      tags: [memory]
      operationId: memoryStatus
      summary: Memory store health stats
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  observation_count:
                    type: integer
                  by_type:
                    type: object
                    additionalProperties:
                      type: integer
                  active_sessions:
                    type: integer
                  total_sessions:
                    type: integer
                  oldest_created:
                    type: string
                  newest_created:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /observations:
    post:
      tags: [memory]
      operationId: observationCreate
      summary: Save an observation
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationInput"
      responses:
        "201":
          description: Observation saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [memory]
      operationId: observationsList
      summary: List stored observations, newest first
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observations"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /observations/recent:
    get:
      tags: [memory]
      operationId: observationsRecent
      summary: Recent session context (alias of /context)
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /search:
    get:
      tags: [memory]
      operationId: search
      summary: Full-text search over observations
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: match_mode
          in: query
          required: false
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observations"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/status:
    get:
      tags: [code]
      operationId: codeStatus
      summary: Code index status
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Index stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_count:
                    type: integer
                  chunk_count:
                    type: integer
                  last_indexed:
                    type: string
                  stale:
                    type: boolean
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/index:
    post:
      tags: [code]
      operationId: codeIndex
      summary: Run incremental code indexing
      parameters:
        - name: dir
          in: query
          required: false
          description: Directory to index (defaults to server CWD)
          schema:
            type: string
      responses:
        "200":
          description: Index run stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  files_indexed:
                    type: integer
                  files_skipped:
                    type: integer
                  files_deleted:
                    type: integer
                  chunks_added:
                    type: integer
        "500":
          $ref: "#/components/responses/Internal"
  /code/files:
    get:
      tags: [code]
      operationId: codeFiles
      summary: List indexed file paths
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File paths
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/search:
    get:
      tags: [code]
      operationId: codeSearch
      summary: Full-text search over indexed code
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching code chunks
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/CodeHit"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/read:
    get:
      tags: [code]
      operationId: codeRead
      summary: Read indexed source for a path
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: start_line
          in: query
          required: false
          schema:
            type: integer
        - name: end_line
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Indexed source
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  start_line:
                    type: integer
                  end_line:
                    type: integer
                  text:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          description: File not indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "500":
          $ref: "#/components/responses/Internal"
  /web/lookup:
    get:
      tags: [web]
      operationId: webLookup
      summary: Check web cache for a matching entry
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [context7, exa, deepwiki, fetch, manual]
        - name: url
          in: query
          required: false
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: library_id
          in: query
          required: false
          schema:
            type: string
        - name: version_tag
          in: query
          required: false
          schema:
            type: string
        - name: repo_name
          in: query
          required: false
          schema:
            type: string
        - name: question
          in: query
          required: false
          schema:
            type: string
        - name: sort_params
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: content_hash
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  fresh:
                    type: boolean
                  id:
                    type: integer
                    format: int64
                  fetched_at:
                    type: string
        expires_at:
          type: string
        cache_key:
          type: string
    # --- Phase 6 schemas ---
    ActivityEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string }
        type: { type: string }
        source: { type: string }
        actor: { type: string, nullable: true }
        severity: { type: string }
        summary: { type: string }
        topicKey: { type: string, nullable: true }
        sessionId: { type: string }
        relatedIds:
          type: array
          items: { type: integer, format: int64 }
    PlanSummary:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        progress: { type: number }
        tasksDone: { type: integer }
        tasksTotal: { type: integer }
        hasLedger: { type: boolean }
    PlanFile:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
    PlanStep:
      type: object
      properties:
        raw: { type: string }
        status: { type: string }
    PlanDetail:
      allOf:
        - $ref: "#/components/schemas/PlanSummary"
        - type: object
          properties:
            files:
              type: array
              items: { $ref: "#/components/schemas/PlanFile" }
            steps:
              type: array
              items: { $ref: "#/components/schemas/PlanStep" }
            briefing: { type: string }
            tasks: { type: string }
    GitCommit:
      type: object
      properties:
        sha: { type: string }
        author: { type: string }
        date: { type: string }
        message: { type: string }
        body: { type: string }
        additions: { type: integer }
        deletions: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/GitFileStat" }
    GitFileStat:
      type: object
      properties:
        path: { type: string }
        additions: { type: integer }
        deletions: { type: integer }
    GitBlameLine:
      type: object
      properties:
        line: { type: integer }
        sha: { type: string }
        author: { type: string }
        summary: { type: string }
        text: { type: string }
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /web/cache:
    post:
      tags: [web]
      operationId: webCacheSave
      summary: Persist a web research snapshot
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSaveInput"
      responses:
        "201":
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /web/search:
    get:
      tags: [web]
      operationId: webSearch
      summary: Full-text search over cached web snapshots
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: fresh_only
          in: query
          required: false
          schema:
