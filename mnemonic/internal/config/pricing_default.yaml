# Model prices for session cost tracking (USD per million tokens).
#
# Cost = input × input_price + output × output_price + cache × cache_price,
# computed when a harness reports usage (POST /sessions/{id}/usage). A model
# missing here has no cost: sessions show "n/a", never a guessed number.
#
# Model ids match case-insensitively after dropping a provider prefix
# ("anthropic/claude-sonnet-4-5" → "claude-sonnet-4-5"); the longest key that
# prefixes the id wins, so "claude-sonnet-4-5-20250929" uses claude-sonnet-4-5.
#
# Override per machine in ~/.skillgrid/config.d/pricing.yaml or per repo in
# config.d/pricing.yaml (walked up from the project root). Later files replace
# individual models; they do not need to repeat the whole table. Verify prices
# against your provider: they change.
models:
  claude-opus-4:      { input: 15.00, output: 75.00, cache: 1.50 }
  claude-opus-4-5:    { input: 5.00,  output: 25.00, cache: 0.50 }
  claude-sonnet-4:    { input: 3.00,  output: 15.00, cache: 0.30 }
  claude-haiku-4-5:   { input: 1.00,  output: 5.00,  cache: 0.10 }
  claude-3-7-sonnet:  { input: 3.00,  output: 15.00, cache: 0.30 }
  claude-3-5-haiku:   { input: 0.80,  output: 4.00,  cache: 0.08 }
  gpt-5:              { input: 1.25,  output: 10.00, cache: 0.125 }
  gpt-5-mini:         { input: 0.25,  output: 2.00,  cache: 0.025 }
  gpt-5-nano:         { input: 0.05,  output: 0.40,  cache: 0.005 }
  gpt-4.1:            { input: 2.00,  output: 8.00,  cache: 0.50 }
  gpt-4.1-mini:       { input: 0.40,  output: 1.60,  cache: 0.10 }
  gpt-4o:             { input: 2.50,  output: 10.00, cache: 1.25 }
  gpt-4o-mini:        { input: 0.15,  output: 0.60,  cache: 0.075 }
  o3:                 { input: 2.00,  output: 8.00,  cache: 0.50 }
  o4-mini:            { input: 1.10,  output: 4.40,  cache: 0.275 }
  gemini-2.5-pro:     { input: 1.25,  output: 10.00, cache: 0.31 }
  gemini-2.5-flash:   { input: 0.30,  output: 2.50,  cache: 0.075 }
  grok-4:             { input: 3.00,  output: 15.00, cache: 0.75 }
