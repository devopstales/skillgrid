# Skillgrid Mnemonic hooks — consumed by opencode-yaml-hooks.
# Installed to ~/.config/kilo/hook/hooks.yaml by `skillgrid setup kilocode`.
#
# Same scripts as OpenCode. SKILLGRID_AGENT=kilo labels the session.
# session.idle only compacts and reports usage.
# Fail-open except opencode-policy.sh, which exits 2 to block a tool.

hooks:
  - id: mnemonic-session-start
    event: session.created
    actions:
      - bash:
          command: "SKILLGRID_AGENT=kilo \"$HOME/.skillgrid/hooks/opencode-session-start.sh\""
          timeout: 10000

  - id: mnemonic-session-stop
    event: session.idle
    actions:
      - bash:
          command: "SKILLGRID_AGENT=kilo \"$HOME/.skillgrid/hooks/opencode-session-end.sh\""
          timeout: 15000

  - id: mnemonic-policy
    event: tool.before.*
    actions:
      - bash:
          command: "SKILLGRID_AGENT=kilo \"$HOME/.skillgrid/hooks/opencode-policy.sh\""
          timeout: 3000

  - id: mnemonic-tool-capture
    event: tool.after.*
    async: true
    actions:
      - bash:
          command: "SKILLGRID_AGENT=kilo \"$HOME/.skillgrid/hooks/opencode-tool-capture.sh\""
          timeout: 5000
