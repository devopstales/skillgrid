# Skillgrid Mnemonic hooks — consumed by opencode-yaml-hooks.
# Installed to ~/.config/opencode/hook/hooks.yaml by `skillgrid setup opencode`.
#
# One event, one script. The scripts live in hooks/ and are copied to
# ~/.skillgrid/hooks/. session.idle only compacts and reports usage.
# stop-tests and gate-stop stay on the Cursor stop hook.
#
# opencode-yaml-hooks provides OPENCODE_SESSION_ID, OPENCODE_PROJECT_DIR, and
# JSON on stdin. Bash stdout is not injected into the session.
# Fail-open except opencode-policy.sh, which exits 2 to block a tool.

hooks:
  - id: mnemonic-session-start
    event: session.created
    actions:
      - bash:
          command: "$HOME/.skillgrid/hooks/opencode-session-start.sh"
          timeout: 10000

  - id: mnemonic-session-stop
    event: session.idle
    actions:
      - bash:
          command: "$HOME/.skillgrid/hooks/opencode-session-end.sh"
          timeout: 15000

  - id: mnemonic-policy
    event: tool.before.*
    actions:
      - bash:
          command: "$HOME/.skillgrid/hooks/opencode-policy.sh"
          timeout: 3000

  - id: mnemonic-tool-capture
    event: tool.after.*
    async: true
    actions:
      - bash:
          command: "$HOME/.skillgrid/hooks/opencode-tool-capture.sh"
          timeout: 5000
