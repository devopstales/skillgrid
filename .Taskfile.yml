version: '3'

vars:
  BIN: aiskillgrid
  VERSION: 0.1.0
  DIST: dist

tasks:
  build:
    desc: Build aiskillgrid for the current platform
    dir: aiskillgrid-cli
    cmds:
      - go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../bin/{{.BIN}} .

  test:
    desc: Run unit tests
    dir: aiskillgrid-cli
    cmds:
      - go test ./...

  install:
    desc: Build and install into ~/.local/bin
    deps: [build]
    cmds:
      - mkdir -p "{{.HOME}}/.local/bin"
      - cp bin/{{.BIN}} "{{.HOME}}/.local/bin/{{.BIN}}"
      - echo "Installed to {{.HOME}}/.local/bin/{{.BIN}}"

  release:
    desc: Cross-compile release binaries into dist/
    dir: aiskillgrid-cli
    cmds:
      - mkdir -p ../{{.DIST}}
      - GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../{{.DIST}}/{{.BIN}}-{{.VERSION}}-darwin-arm64 .
      - GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../{{.DIST}}/{{.BIN}}-{{.VERSION}}-darwin-amd64 .
      - GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../{{.DIST}}/{{.BIN}}-{{.VERSION}}-linux-amd64 .
      - GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../{{.DIST}}/{{.BIN}}-{{.VERSION}}-linux-arm64 .
      - GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/aiskillgrid/aiskillgrid/cmd.Version={{.VERSION}}" -o ../{{.DIST}}/{{.BIN}}-{{.VERSION}}-windows-amd64.exe .

  sync:
    desc: Run aiskillgrid sync
    deps: [build]
    cmds:
      - ./bin/{{.BIN}} sync

  status:
    desc: Run aiskillgrid status
    deps: [build]
    cmds:
      - ./bin/{{.BIN}} status
