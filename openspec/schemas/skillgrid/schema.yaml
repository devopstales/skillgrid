name: skillgrid
version: 1
description: SkillGrid OpenSpec workflow proposal -> specs -> design -> adr -> apply
artifacts:
  - id: proposal
    generates: proposal.md
    description: Structured proposal documenting why the change matters
    template: proposal.md
    instruction: >
      Create the proposal document using the `grill-me`, `glossary`,
      `brainstorming`, and `project-context` skills.

       Sections:

       - **Why** - 1-2 sentences on the problem or opportunity. What problem does
       this solve? Why now?

       - **What Changes** - Bullet list of changes. Be specific about new
       capabilities, modifications, or removals. Mark breaking changes with
       **BREAKING**.

       - **Capabilities** - Identify which behaviour specs will be created or modified:
         - **New Capabilities** - List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
         - **Modified Capabilities** - List existing capabilities whose behaviour is changing. Only include if spec-level behaviour changes, not just implementation details. Each needs an OpenSpec Markdown delta file at `specs/<name>/spec.md`. Check `openspec/specs/` for existing spec names. Leave empty if no behaviour changes.

       - **Impact** - Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.

      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <repo>/adr/ by a later step after design.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.
  - id: specs
    generates: specs/**/*.md
    description: Gherkin-style specifications with 1:1 acceptance test mapping
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.
      Use `gherkin-authoring` for scenario authoring, `spec-as-source` for
      delta spec structure, and `c4-diagrams` and `glossary` for context.

      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.

      Delta operations (use ## headers):

      - **ADDED Requirements** - New capabilities

      - **MODIFIED Requirements** - Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements** - Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements** - Name changes only - use FROM:/TO: format

      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL** - Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.

      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason** - Replaced by new export system

      **Migration** - Use new export endpoint at /api/v2/export

      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.
      Use `c4-diagrams` and `glossary` for context.

      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding

      Prior decisions (read existing ADRs first):

      Before writing, list every file in <repo>/adr/. Build the supersession
      graph from each ADR's Supersedes field - an ADR is no longer in force if
      a later ADR's Supersedes points at it. Only the currently-in-force ADRs
      (accepted, not superseded) constrain this design. Older superseded ADRs
      are historical context only and MUST NOT be treated as live commitments.
      New design choices MUST be coherent with the in-force set. If a current
      ADR needs to be revisited, do not propose modifying it; flag it under
      Open Questions and let the adr step record a new superseding ADR.

      Sections:

      - **Context** - Background, current state, constraints, stakeholders

      - **Goals / Non-Goals** - What this design achieves and explicitly excludes

      - **Decisions** - Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs** - Known limitations, things that could go wrong.
      Format: [Risk] -> Mitigation

      - **Migration Plan** - Steps to deploy, rollback strategy (if applicable)

      - **Open Questions** - Outstanding decisions or unknowns to resolve.
      Include any in-force ADRs that this design suggests revisiting; the adr
      step will record the supersession.

      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: adr
    generates: adr.md
    description: Per-change ADR review manifest and durable decision handoff
    template: adr.md
    instruction: >
      Complete ADR review for this change by writing a concise manifest at
      openspec/changes/<change>/adr.md. This change-local file is the artifact
      completion marker for the adr step. Use the
      `architectural-decision-records` and `grill-me` skills. Existing files
      under <repo>/adr/ are required context for the review, but they MUST NOT
      satisfy completion for a new change.

      Use the `architectural-decision-records` skill for ADR authoring.

      If the change introduces a major durable architectural decision, also
      create an Architecture Decision Record under <repo>/adr/. The path
      <repo>/adr/ means the target repository's top-level adr/ folder beside
      openspec/, not any folder inside openspec/. Repository-level ADR files
      persist across changes and MUST be written outside openspec/.

      IRON RULE - ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance, not its Status, not its body, not its
      date. To change a previously accepted decision, record a NEW ADR whose
      Status is "accepted, supersedes ADR-NNNN" and whose `Supersedes:` field
      names the prior one. Design consumers derive what is currently in force
      by walking Supersedes links across the folder. The prior ADR's contents
      stay frozen as a historical record.

      Process:

      1. Read every existing ADR in <repo>/adr/. Build the supersession graph
      from each ADR's Supersedes field. Note the highest sequence number in
      use.

      2. Re-read design.md. Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) - not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one. If diverging, the new ADR supersedes the
      prior.

      3. For each qualifying decision, create a NEW repository-level file at
      <repo>/adr/NNNN-kebab-title.md, where NNNN is a 4-digit sequence one
      greater than the highest existing. Include title, Status, Date, optional
      Supersedes, and MADR-short sections: Context, Decision, and
      Consequences. If this decision replaces a prior in-force ADR, set Status to
      "accepted, supersedes ADR-NNNN", populate the `Supersedes:` field, and
      explain in Context why the prior decision is being revisited. Do NOT
      touch the prior ADR's file.

      4. Write openspec/changes/<change>/adr.md using the template. The
      manifest MUST state that ADR review completed for this change, list the
      in-force ADR context reviewed, and reference every repository-level ADR
      file created for this change. It MUST NOT duplicate full Context,
      Decision, or Consequences content from repository-level ADR files.

      5. If nothing meets the bar, do not invent ADRs. The manifest MUST
      explicitly state that no major durable architectural decisions were
      introduced and no new repository-level ADR files were created.

      Filename convention: NNNN-kebab-title.md (e.g.,
      0042-use-postgres-for-catalog.md). Sequence is monotonic across the
      whole repo and never reused.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Epic and Stories breakdown for implementation
    template: tasks.md
    instruction: >
      Create the Epic and Stories that break down the implementation work.
      Use `write-tasks` and `spec-as-source` to translate the design into
      discrete, actionable tasks.

      Guidelines:

      - Group related work under ## Epic headings.

      - Break each Epic into Stories: `- [ ] <story-id> <story description>`.

      - Each Story should be small enough to complete in one session.

      - Order Stories by dependency (what must be done first?).

      - If implementation changes behaviour specs, include a Story to run
      `openspec validate <change> --type change --strict` before archive.

      Reference specs for what to build, design for how to build it, and
      <repo>/adr/ for durable architectural commitments to honor.

      Each Story should be verifiable - you know when it's done.
    requires:
      - specs
      - adr
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Execute the Epic and Stories using Subagent-Driven Development (SDD).
    
    Primary skills:
    - `subagent-driven-development` (SDD): Master orchestrator that reads the
      Traveling Spec, sets up the .skillgrid/sdd/ workspace, and dispatches
      subagents.
    - `executing-designs` (renamed `executing-plans`): Implement the design
      task-by-task.
    - `using-git-worktrees`: Ensure builds happen in an isolated git worktree
      so the main branch is not corrupted.
    - `micro-commits`: Commit at checkpoints.
    - `validation`: Verify implementation against specs.
    
    Context Loading: Pass the "traveling spec," ADRs, and design documents to
    the implementation agents.
    
    Batching: Do not dispatch a new agent for every 1-line change. Batch small,
    same-shape tasks into a single dispatch to reduce context-switching overhead.
    
    Review Loop: Implementation agents write the code; separate "Reviewer"
    agents check the output against the Gherkin scenarios defined in specs.
    
    Read context files, work through pending Stories, mark complete as you go.
    Pause if you hit blockers or need clarification.
