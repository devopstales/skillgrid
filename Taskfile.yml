version: '3'

tasks:
  install-obsidian-plugin:
    desc: "Build and install the Obsidian Backlog.md plugin into a vault"
    summary: |
      Builds plugins/obsidian/backlogmd and copies main.js, manifest.json, styles.css
      into <vault>/.obsidian/plugins/backlogmd/.
      Usage: task install-obsidian-plugin VAULT=/path/to/vault
    vars:
      VAULT: '{{.VAULT | default ""}}'
    requires:
      vars: [VAULT]
    cmds:
      - cd plugins/obsidian/backlogmd && npm install && npm run build
      - mkdir -p "{{.VAULT}}/.obsidian/plugins/backlogmd"
      - cp plugins/obsidian/backlogmd/main.js plugins/obsidian/backlogmd/manifest.json plugins/obsidian/backlogmd/styles.css "{{.VAULT}}/.obsidian/plugins/backlogmd/"
      - echo "Installed Backlog.md plugin to {{.VAULT}}/.obsidian/plugins/backlogmd"