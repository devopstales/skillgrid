# Taskfile for skillgrid (https://taskfile.dev).
#
#   task              build the local platform binary into dist/
#   task all          cross-build linux (amd64+386) and darwin (amd64+arm64)
#   task test         go vet && go test in skillgrid-cli/
#   task seed-test     run the Mnemonic all-stores seed integration tests
#   task fmt          gofmt -w the module
#   task clean        remove dist/
#   task install      copy dist/skillgrid-linux-amd64 → ~/.skillgrid/bin/skillgrid
#   task version      show the version that would be baked in
#
# Version is derived from `git describe --tags --always --dirty`.
# Override with SKILLGRID_VERSION=vX.Y.Z env.

version: "3"

vars:
  MODULE_DIR: skillgrid-cli
  BIN: skillgrid
  OUT: dist
  PKG: "./cmd/skillgrid"
  VERSION:
    sh: 'echo "${SKILLGRID_VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo 0.1.0-dev)}"'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the local platform binary into dist/.
    cmds:
      - cd {{.MODULE_DIR}} && mkdir -p ../{{.OUT}}
      - cd {{.MODULE_DIR}} && go build -ldflags "-s -w -X main.version={{.VERSION}}" -o ../{{.OUT}}/{{.BIN}} {{.PKG}}

  all:
    desc: Cross-build linux amd64+386 and darwin amd64+arm64.
    cmds:
      - mkdir -p {{.OUT}}
      - task: build-linux
      - task: build-darwin

  build-linux:
    desc: Build linux binaries (amd64 + 386).
    cmds:
      - cd {{.MODULE_DIR}} && GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version={{.VERSION}}" -o ../{{.OUT}}/{{.BIN}}-linux-amd64 {{.PKG}}
      - cd {{.MODULE_DIR}} && GOOS=linux GOARCH=386 go build -ldflags "-s -w -X main.version={{.VERSION}}" -o ../{{.OUT}}/{{.BIN}}-linux-386 {{.PKG}}

  build-darwin:
    desc: Build macOS binaries (amd64 + arm64).
    cmds:
      - cd {{.MODULE_DIR}} && GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version={{.VERSION}}" -o ../{{.OUT}}/{{.BIN}}-darwin-amd64 {{.PKG}}
      - cd {{.MODULE_DIR}} && GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version={{.VERSION}}" -o ../{{.OUT}}/{{.BIN}}-darwin-arm64 {{.PKG}}

  test:
    desc: Run go vet and go test ./... in skillgrid-cli/.
    cmds:
      - cd {{.MODULE_DIR}} && go vet ./...
      - cd {{.MODULE_DIR}} && go test ./...

  seed-test:
    desc: Run the Mnemonic all-stores seed integration tests (memory + code index + web cache).
    cmds:
      - cd {{.MODULE_DIR}} && go test -v -run TestSeed ./internal/mnemonic/integration/

  fmt:
    desc: gofmt -w the whole module.
    cmds:
      - cd {{.MODULE_DIR}} && gofmt -l -w .

  clean:
    desc: Remove dist/.
    cmds:
      - rm -rf {{.OUT}}

  version:
    desc: Show the version that would be baked in.
    cmds:
      - echo {{.VERSION}}

  install:
    desc: Install the linux-amd64 binary into ~/.skillgrid/bin (after `task all`).
    cmds:
      - mkdir -p "$HOME/.skillgrid/bin"
      - cp {{.OUT}}/{{.BIN}}-linux-amd64 "$HOME/.skillgrid/bin/{{.BIN}}"
      - chmod +x "$HOME/.skillgrid/bin/{{.BIN}}"
      - echo "installed to $HOME/.skillgrid/bin/{{.BIN}}"
