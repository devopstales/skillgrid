version: '3'

vars:
  APP_NAME: aiskillgrid-cli
  BUILD_DIR: bin
  MAIN_PKG: ./cmd
  VERSION: "1.0.0"

tasks:
  default:
    cmds:
      - task: build
  
  build:
    desc: Build the application for current platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cd aiskillgrid-cli && go build -ldflags="-s -w" -o ../{{.BUILD_DIR}}/{{.APP_NAME}} {{.MAIN_PKG}}
  
  build-darwin-amd64:
    desc: Build for macOS Intel (amd64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cd aiskillgrid-cli && GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../{{.BUILD_DIR}}/{{.APP_NAME}}-darwin-amd64 {{.MAIN_PKG}}
  
  build-darwin-arm64:
    desc: Build for macOS Apple Silicon (arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cd aiskillgrid-cli && GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../{{.BUILD_DIR}}/{{.APP_NAME}}-darwin-arm64 {{.MAIN_PKG}}
  
  build-linux-amd64:
    desc: Build for Linux Intel (amd64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cd aiskillgrid-cli && GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../{{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 {{.MAIN_PKG}}
  
  build-linux-arm64:
    desc: Build for Linux ARM (arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - cd aiskillgrid-cli && GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../{{.BUILD_DIR}}/{{.APP_NAME}}-linux-arm64 {{.MAIN_PKG}}
  
  build-all:
    desc: Build for all target platforms
    cmds:
      - task: build-darwin-amd64
      - task: build-darwin-arm64
      - task: build-linux-amd64
      - task: build-linux-arm64
      - echo "Builds completed. Check {{.BUILD_DIR}} directory."

  release-build:
    desc: Build for all platforms and create release package
    cmds:
      - rm -rf dist/
      - mkdir -p dist/
      - task: build-all
      - |
        cd {{.BUILD_DIR}} && \
        tar czf ../dist/{{.APP_NAME}}-release-darwin-amd64.tar.gz {{.APP_NAME}}-darwin-amd64 && \
        tar czf ../dist/{{.APP_NAME}}-release-darwin-arm64.tar.gz {{.APP_NAME}}-darwin-arm64 && \
        tar czf ../dist/{{.APP_NAME}}-release-linux-amd64.tar.gz {{.APP_NAME}}-linux-amd64 && \
        tar czf ../dist/{{.APP_NAME}}-release-linux-arm64.tar.gz {{.APP_NAME}}-linux-arm64 && \
        cd .. && echo "Release packages created in dist/"

  install-cli:
    desc: Build and install CLI binary to ~/go/bin
    cmds:
      - mkdir -p ~/go/bin
      - cd aiskillgrid-cli && go install {{.MAIN_PKG}}
  
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}/ dist/
  
  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  test-cli:
    desc: Run CLI tests only
    cmds:
      - cd aiskillgrid-cli && go test ./...
  
  mod-tidy:
    desc: Clean up go modules
    cmds:
      - go mod tidy
  
  mod-download:
    desc: Download and verify dependencies
    cmds:
      - go mod download
