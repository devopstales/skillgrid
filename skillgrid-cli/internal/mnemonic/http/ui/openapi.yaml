openapi: 3.0.3
info:
  title: Skillgrid Mnemonic HTTP API
  description: |-
    Persistent memory, code index, and web research cache for AI agents.

    Write routes (POST) optionally require an `Authorization: Bearer <token>`
    header when the server is started with `SKILLGRID_HTTP_TOKEN` set.
    Most routes take a `project` query parameter naming the project store
    (see `GET /projects` for available IDs).
  version: "0.1.0"
servers:
  - url: /
tags:
  - name: health
  - name: session
  - name: memory
  - name: code
  - name: web
  - name: tracker
  - name: ui
paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Health probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /projects:
    get:
      tags: [memory]
      operationId: listProjects
      summary: List project store IDs
      responses:
        "200":
          description: Project IDs
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      type: string
  /sessions:
    post:
      tags: [session]
      operationId: sessionCreate
      summary: Create a workspace session
      parameters:
        - name: directory
          in: query
          required: false
          description: Working directory for the session (defaults to `.`)
          schema:
            type: string
        - name: title
          in: query
          required: false
          description: Optional human-readable session name, shown in the web dashboard session list
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: string
                title:
                  type: string
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "500":
          $ref: "#/components/responses/Internal"
  /sessions/{id}/end:
    post:
      tags: [session]
      operationId: sessionEnd
      summary: End a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  status:
                    type: string
        "500":
          $ref: "#/components/responses/Internal"
  /context:
    get:
      tags: [memory]
      operationId: context
      summary: Recent session context
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /memory/status:
    get:
      tags: [memory]
      operationId: memoryStatus
      summary: Memory store health stats
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  observation_count:
                    type: integer
                  by_type:
                    type: object
                    additionalProperties:
                      type: integer
                  active_sessions:
                    type: integer
                  total_sessions:
                    type: integer
                  oldest_created:
                    type: string
                  newest_created:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /observations:
    post:
      tags: [memory]
      operationId: observationCreate
      summary: Save an observation
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationInput"
      responses:
        "201":
          description: Observation saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [memory]
      operationId: observationsList
      summary: List stored observations, newest first
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observations"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /observations/recent:
    get:
      tags: [memory]
      operationId: observationsRecent
      summary: Recent session context (alias of /context)
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /search:
    get:
      tags: [memory]
      operationId: search
      summary: Full-text search over observations
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: match_mode
          in: query
          required: false
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observations"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/status:
    get:
      tags: [code]
      operationId: codeStatus
      summary: Code index status
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Index stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_count:
                    type: integer
                  chunk_count:
                    type: integer
                  last_indexed:
                    type: string
                  stale:
                    type: boolean
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/index:
    post:
      tags: [code]
      operationId: codeIndex
      summary: Run incremental code indexing
      parameters:
        - name: dir
          in: query
          required: false
          description: Directory to index (defaults to server CWD)
          schema:
            type: string
      responses:
        "200":
          description: Index run stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  files_indexed:
                    type: integer
                  files_skipped:
                    type: integer
                  files_deleted:
                    type: integer
                  chunks_added:
                    type: integer
        "500":
          $ref: "#/components/responses/Internal"
  /code/files:
    get:
      tags: [code]
      operationId: codeFiles
      summary: List indexed file paths
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File paths
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/search:
    get:
      tags: [code]
      operationId: codeSearch
      summary: Full-text search over indexed code
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching code chunks
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/CodeHit"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /code/read:
    get:
      tags: [code]
      operationId: codeRead
      summary: Read indexed source for a path
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: start_line
          in: query
          required: false
          schema:
            type: integer
        - name: end_line
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Indexed source
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  start_line:
                    type: integer
                  end_line:
                    type: integer
                  text:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          description: File not indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "500":
          $ref: "#/components/responses/Internal"
  /web/lookup:
    get:
      tags: [web]
      operationId: webLookup
      summary: Check web cache for a matching entry
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [context7, exa, deepwiki, fetch, manual]
        - name: url
          in: query
          required: false
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: library_id
          in: query
          required: false
          schema:
            type: string
        - name: version_tag
          in: query
          required: false
          schema:
            type: string
        - name: repo_name
          in: query
          required: false
          schema:
            type: string
        - name: question
          in: query
          required: false
          schema:
            type: string
        - name: sort_params
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: content_hash
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  fresh:
                    type: boolean
                  id:
                    type: integer
                    format: int64
                  fetched_at:
                    type: string
                  expires_at:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /web/cache:
    post:
      tags: [web]
      operationId: webCacheSave
      summary: Persist a web research snapshot
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSaveInput"
      responses:
        "201":
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /web/search:
    get:
      tags: [web]
      operationId: webSearch
      summary: Full-text search over cached web snapshots
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: fresh_only
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebHit"
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  /web/entry/{id}:
    get:
      tags: [web]
      operationId: webEntry
      summary: Full cached snapshot by ID (including content)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "500":
          $ref: "#/components/responses/Internal"
  /web/status:
    get:
      tags: [web]
      operationId: webStatus
      summary: Web cache health stats
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_entries:
                    type: integer
                  expired_entries:
                    type: integer
                  by_source:
                    type: object
                    additionalProperties:
                      type: integer
                  oldest_fetch:
                    type: string
                  newest_fetch:
                    type: string
        "400":
          $ref: "#/components/responses/Bad"
        "500":
          $ref: "#/components/responses/Internal"
  # ── Memory (009 P4) — observation control panel + 013 governance ──────
  /observations/{id}:
    get:
      tags: [memory]
      operationId: observationGet
      summary: One observation, full untruncated content
      description: |-
        Open read for the P4 detail pane. Same shape as mem_get_observation;
        404 for an unknown id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"
              example:
                id: 12
                type: decision
                title: Chose SQLite for the store
                content: "Decided to use SQLite …"
                owner: paladm
                visibility: private
                status: active
                revision_count: 2
                retrieval_usage: 3
                pinned: true
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}/pin:
    post:
      tags: [memory]
      operationId: observationPin
      summary: Pin an observation (sticky, idempotent, write-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pinned
          content:
            application/json:
              schema:
                type: object
                required: [id, pinned]
                properties:
                  id:
                    type: integer
                    format: int64
                  pinned:
                    type: boolean
              example:
                id: 12
                pinned: true
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}/unpin:
    post:
      tags: [memory]
      operationId: observationUnpin
      summary: Unpin an observation (idempotent, write-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unpinned
          content:
            application/json:
              schema:
                type: object
                required: [id, pinned]
                properties:
                  id:
                    type: integer
                    format: int64
                  pinned:
                    type: boolean
              example:
                id: 12
                pinned: false
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}/share:
    post:
      tags: [memory]
      operationId: observationShare
      summary: Widen an observation's visibility (013 governance, idempotent, write-gated)
      description: |-
        `restricted` accepts an ACL `grants` list of grantee names. Unknown
        visibility → 400 (visibility unchanged).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  type: string
                  enum: [private, team, restricted, agent]
                grants:
                  type: array
                  items:
                    type: string
            example:
              visibility: restricted
              grants: [agent-bob]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [id, visibility]
                properties:
                  id:
                    type: integer
                    format: int64
                  visibility:
                    type: string
              example:
                id: 12
                visibility: restricted
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}/status:
    post:
      tags: [memory]
      operationId: observationStatus
      summary: Set an observation's lifecycle status (write-gated)
      description: Unknown status → 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, superseded, archived]
            example:
              status: superseded
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    type: string
              example:
                id: 12
                status: superseded
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}/governance:
    get:
      tags: [memory]
      operationId: observationGovernance
      summary: Governed-asset view (owner, version history, ACL, usage)
      description: |-
        Open read behind the P4 governance widgets. Versions is the
        append-only history (the live content is the latest revision; prior
        content is recoverable here after an in-place edit).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Governance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Governance"
              example:
                id: 12
                owner: paladm
                visibility: restricted
                status: active
                revision_count: 2
                retrieval_usage: 3
                versions:
                  - revision: 1
                    content: "old content"
                    created_at: "2026-01-01T00:00:00Z"
                  - revision: 2
                    content: "current content"
                    created_at: "2026-01-02T00:00:00Z"
                grants:
                  - grantee: agent-bob
                    grant_type: read
        "404":
          $ref: "#/components/responses/Bad"
  /memory/observations/{id}:
    patch:
      tags: [memory]
      operationId: observationUpdate
      summary: Edit an observation in place (write-gated; appends a 013 version)
      description: |-
        Accepts content and optionally title/type/topic_key/scope. A content
        edit appends a new revision server-side; the prior content is
        recoverable via GET /memory/observations/{id}/governance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                title:
                  type: string
                type:
                  type: string
                topic_key:
                  type: string
                scope:
                  type: string
            example:
              content: "revised content"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [id, updated]
                properties:
                  id:
                    type: integer
                    format: int64
                  updated:
                    type: boolean
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
    delete:
      tags: [memory]
      operationId: observationDelete
      summary: Delete an observation (soft by default; ?hard=true for hard, write-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: hard
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                    format: int64
                  deleted:
                    type: boolean
                  hard:
                    type: boolean
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /relations/{id}:
    get:
      tags: [memory]
      operationId: relationsOf
      summary: Relations touching an observation (the P4 drill-down)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relation list
          content:
            application/json:
              schema:
                type: object
                required: [id, relations, count]
                properties:
                  id:
                    type: integer
                    format: int64
                  relations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Relation"
                  count:
                    type: integer
              example:
                id: 12
                count: 1
                relations:
                  - id: 3
                    src_obs_id: 12
                    dst_obs_id: 30
                    relation: extracted
                    confidence: 0.9
                    reason: "derived from the session"
                    created_at: "2026-01-02T00:00:00Z"
        "404":
          $ref: "#/components/responses/Bad"
  /tracker/config:
    get:
      tags: [tracker]
      operationId: trackerConfig
      summary: Active tracker provider with its statuses, types, and priorities
      description: |-
        Resolved from SKILLGRID_TRACKER, docs/skillgrid/agents/issue-tracker.md,
        then config.yaml (default backlogmd). 501 when unresolvable, 503 when the
        provider CLI is missing, 502 on CLI failure.
      responses:
        "200":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerConfig"
              example:
                provider: backlogmd
                statuses: [needs-triage, ready-for-agent, done]
                types: [feature, bug, chore]
                priorities: [high, medium, low]
                schema_version: "1"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /tracker/tasks:
    get:
      tags: [tracker]
      operationId: trackerList
      summary: List tracker items as normalized DTOs
      responses:
        "200":
          description: Normalized item list with provider name
          content:
            application/json:
              schema:
                type: object
                required: [tasks, provider]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackerItem"
                  provider:
                    type: string
              example:
                provider: backlogmd
                tasks:
                  - id: TASK-001
                    title: Fix login
                    status: needs-triage
                    type: feature
                    priority: high
                    ac_completed: 1
                    ac_total: 4
                    is_ready: true
                    provider: backlogmd
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /tracker/tasks/{id}:
    get:
      tags: [tracker]
      operationId: trackerGet
      summary: One tracker item as a normalized DTO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
    post:
      tags: [tracker]
      operationId: trackerSetStatus
      summary: Change an item's status (provider-native, write-gated)
      description: |-
        Backlog.md runs `task edit -s`; GitHub/GitLab close/reopen; Jira runs
        `issue move`. Requires the bearer token when SKILLGRID_HTTP_TOKEN is set.
        400 on a status outside the provider set, 501 where the provider has no
        equivalent transition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
            example:
              status: ready-for-agent
      responses:
        "200":
          description: Updated normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "400":
          $ref: "#/components/responses/Bad"
        "401":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
        "502":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Internal"
  /backlog/config:
    get:
      tags: [tracker]
      operationId: backlogConfigAlias
      summary: Alias of GET /tracker/config on Backlog.md repos (else 501)
      responses:
        "200":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerConfig"
        "501":
          $ref: "#/components/responses/Bad"
  /backlog/tasks:
    get:
      tags: [tracker]
      operationId: backlogListAlias
      summary: Alias of GET /tracker/tasks on Backlog.md repos (else 501)
      responses:
        "200":
          description: Normalized item list with provider name
          content:
            application/json:
              schema:
                type: object
                required: [tasks, provider]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackerItem"
                  provider:
                    type: string
        "501":
          $ref: "#/components/responses/Bad"
  /backlog/tasks/{id}:
    get:
      tags: [tracker]
      operationId: backlogGetAlias
      summary: Alias of GET /tracker/tasks/{id} on Backlog.md repos (else 501)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerItem"
        "404":
          $ref: "#/components/responses/Bad"
        "501":
          $ref: "#/components/responses/Bad"
  /docs/changes:
    get:
      tags: [docs]
      operationId: docsList
      summary: List SDD changes (name, status, ticket id)
      description: |-
        Read-only view of docs/skillgrid/changes and docs/skillgrid/archive.
        The ticket id is parsed from each change.md `Ticket:` line (backticks
        and annotations stripped by the UI, not here).
      responses:
        "200":
          description: Change list
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocChange"
              example:
                changes:
                  - name: 009-web-admin-dashboard
                    status: in-progress
                    ticket: TASK-001
                  - name: 004-hermes-memory
                    status: draft
                    ticket: "task-001"
        "500":
          $ref: "#/components/responses/Internal"
  /docs/changes/{name}:
    get:
      tags: [docs]
      operationId: docsGet
      summary: One change's change.md + tasks.md text
      description: |-
        Sandboxed to the two docs roots: names with `..`, absolute paths, or
        escapes return 400; unknown names return 404. Read-only — files are
        served as text, never executed.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: 009-web-admin-dashboard
      responses:
        "200":
          description: Change documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocChangeDetail"
              example:
                name: 009-web-admin-dashboard
                status: in-progress
                ticket: TASK-001
                change_md: "# Change: 009-web-admin-dashboard\n\n**Ticket:** TASK-001\n"
                tasks_md: "# Tasks: 009-web-admin-dashboard\n"
        "400":
          $ref: "#/components/responses/Bad"
        "404":
          $ref: "#/components/responses/Bad"
  /swagger-ui:
    get:
      tags: [ui]
      operationId: swaggerUI
      summary: Swagger UI (interactive API explorer)
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}
  /openapi.yaml:
    get:
      tags: [ui]
      operationId: openAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml: {}
components:
  responses:
    Bad:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPError"
    Internal:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPError"
  schemas:
    HTTPError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DocChange:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Change directory name (NNN-slug)
          example: 009-web-admin-dashboard
        status:
          type: string
          description: Parsed from the change.md `STATUS:` line (lowercased); "unknown" when absent
          example: in-progress
        ticket:
          type: string
          description: Parsed from the change.md `Ticket:` line; absent when the change has no ticket
          example: TASK-001
    DocChangeDetail:
      type: object
      required: [name, status, change_md]
      properties:
        name:
          type: string
        status:
          type: string
        ticket:
          type: string
          description: Absent when the change has no `Ticket:` line (the UI renders no tracker link, not an error)
        change_md:
          type: string
          description: Full change.md text
        tasks_md:
          type: string
          description: Full tasks.md text; absent when the change has no tasks.md
    TrackerItem:
      type: object
      required: [id, title, status, board, provider]
      properties:
        id:
          type: string
          description: Provider-native identifier (TASK-001, 12, PROJ-1)
        title:
          type: string
        status:
          type: string
          description: Provider-native status
        status_detail:
          type: string
        description:
          type: string
          description: Item body (Backlog.md description, GitHub body, GitLab description)
        board:
          type: string
          description: Canonical kanban column (todo|in_progress|blocked|done) for one consistent board
          enum: [todo, in_progress, blocked, done]
        type:
          type: string
        priority:
          type: string
        assignees:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        doc_refs:
          type: array
          description: Linked document paths (used by the Docs entry)
          items:
            type: string
        ac_completed:
          type: integer
        ac_total:
          type: integer
        is_ready:
          type: boolean
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        provider:
          type: string
    TrackerConfig:
      type: object
      required: [provider, statuses]
      properties:
        provider:
          type: string
        statuses:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        priorities:
          type: array
          items:
            type: string
        version:
          type: string
        schema_version:
          type: string
        repo:
          type: string
        project_key:
          type: string
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    SessionCreated:
      type: object
      required: [session_id, project_id]
      properties:
        session_id:
          type: string
        project_id:
          type: string
        title:
          type: string
          nullable: true
    Sessions:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Session:
      type: object
      properties:
        id:
          type: string
        project:
          type: string
        directory:
          type: string
        title:
          type: string
          nullable: true
          description: Human-readable session name (optional); shown in the dashboard session list
        started_at:
          type: string
        ended_at:
          type: string
        summary:
          type: string
        status:
          type: string
    Observations:
      type: object
      required: [observations]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
    Observation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
        type:
          type: string
        title:
          type: string
        content:
          type: string
        project:
          type: string
        scope:
          type: string
        topic_key:
          type: string
        normalized_hash:
          type: string
        revision_count:
          type: integer
        owner:
          type: string
          description: Governing identity (013 step 01); absent when unset
        visibility:
          type: string
          description: 013 visibility (private by default)
          enum: [private, team, restricted, agent]
        status:
          type: string
          description: 013 lifecycle status
          enum: [active, superseded, archived]
        retrieval_usage:
          type: integer
          description: How often this observation was retrieved
        prompt_id:
          type: integer
          format: int64
          nullable: true
        pinned:
          type: boolean
          description: Local "sticky" marker; pinned observations sort first
        duplicate_count:
          type: integer
        last_seen_at:
          type: string
        expires_at:
          type: string
        tool_name:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    Relation:
      type: object
      required: [id, src_obs_id, dst_obs_id, relation, created_at]
      properties:
        id:
          type: integer
          format: int64
        src_obs_id:
          type: integer
          format: int64
        dst_obs_id:
          type: integer
          format: int64
        relation:
          type: string
          description: Relation type (extracted, inferred, relates_to, supports, conflicts_with)
        confidence:
          type: number
          format: double
          description: 0..1 confidence; absent when unscored
        reason:
          type: string
        created_at:
          type: string
    Governance:
      type: object
      required: [id, owner, visibility, status, revision_count, retrieval_usage, versions]
      properties:
        id:
          type: integer
          format: int64
        owner:
          type: string
        visibility:
          type: string
          enum: [private, team, restricted, agent]
        status:
          type: string
          enum: [active, superseded, archived]
        revision_count:
          type: integer
        retrieval_usage:
          type: integer
        versions:
          type: array
          description: Append-only content history; the latest revision is the live content
          items:
            type: object
            required: [revision, content, created_at]
            properties:
              revision:
                type: integer
              content:
                type: string
              created_at:
                type: string
        grants:
          type: array
          description: ACL grants (restricted/agent visibility)
          items:
            type: object
            required: [grantee, grant_type]
            properties:
              grantee:
                type: string
              grant_type:
                type: string
        restricted_no_grants:
          type: boolean
          description: True when visibility is restricted and no ACL grants exist (owner-only)
    ObservationInput:
      type: object
      required: [title, type, content, session_id]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [decision, architecture, bugfix, pattern, config, discovery, learning, preference]
        content:
          type: string
        scope:
          type: string
          enum: [project, user, global]
        topic_key:
          type: string
        session_id:
          type: string
    CodeHit:
      type: object
      properties:
        path:
          type: string
        start_line:
          type: integer
        end_line:
          type: integer
        snippet:
          type: string
        score:
          type: number
          format: double
    WebSaveInput:
      type: object
      required: [source, content]
      properties:
        source:
          type: string
          enum: [context7, exa, deepwiki, fetch, manual]
        url:
          type: string
        title:
          type: string
        query:
          type: string
        library_id:
          type: string
        version_tag:
          type: string
        repo_name:
          type: string
        question:
          type: string
        sort_params:
          type: string
        content:
          type: string
        metadata:
          type: string
        session_id:
          type: string
    WebEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project:
          type: string
        source:
          type: string
        cache_key:
          type: string
        url:
          type: string
        title:
          type: string
        query:
          type: string
        library_id:
          type: string
        version_tag:
          type: string
        content:
          type: string
        metadata_json:
          type: string
        content_hash:
          type: string
        fetched_at:
          type: string
        expires_at:
          type: string
        session_id:
          type: string
        created_at:
          type: string
    WebHit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        title:
          type: string
        query:
          type: string
        url:
          type: string
        library_id:
          type: string
        fetched_at:
          type: string
        expires_at:
          type: string
