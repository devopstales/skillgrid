# Skillgrid SDD config — source of truth for this project's pipeline.
# Schema per skillgrid-skills/.agents/skills/onboarding/templates/config.yaml
# (the "standard" format). Migrated 2026-09-16 from docs/skillgrid/config.yaml
# (old skillgrid-sdd/v1 layout); rules.* phase guidance preserved under `rules:`.
schema: skillgrid/v1
project: skillgrid
context: >-
  Go 1.25.5 monorepo: `skillgrid-cli/` (Go binary) installs the AI-assisted
  development hub onto a machine, wiring OpenCode, Kilo, and Cursor with
  Mnemonic persistent memory, code indexing, and web research caching.
  Constraints: Go 1.22+ to build; Node/npm on PATH at install time.

# --- Ticketing ---
ticketing:
  enabled: true
  type: backlogmd
  backlogmd:
    dir: .backlog
    task_prefix: "task"
    zero_padded_ids: 3

# --- Testing ---
testing:
  runner: "go test ./..."
  setup: "go build ./..."
  layers: [unit, integration]
  coverage: "" # no enforced minimum; verify reports changed-file coverage informationally
  mutation: "" # no mutation tooling configured
  tdd: false # basic TDD (a failing test before code) is always the baseline in Skillgrid execution skills; this flag selects the strict-TDD branch machinery (see rules.apply.tdd), off by default (Standard mode)

# --- QA Gates (configurable thresholds) ---
quality:
  coverage_min: 0 # advisory only (80 reported informationally, never blocking)
  mutation_min: 0 # disabled (no mutation tooling)
  p0_pass_rate: 100
  p1_pass_rate: 95

# --- Security Scan (Trivy) ---
# Trivy is a multi-scanner: vulnerability (CVE), misconfiguration, secret,
# and license. The skillgrid:qa skill runs it during the Security Audit step.
# command: the trivy invocation ("" = disabled, falls back to manual checks)
# target: what to scan (default: the current directory)
# severities: minimum severity to report (comma-separated, highest first)
#   CRITICAL (default) | CRITICAL,HIGH | CRITICAL,HIGH,MEDIUM | all
# scan_types: which scanners to run (comma-separated)
#   vuln (default) | vuln,misconfig | vuln,secret | vuln,secret,misconfig,license
# fail_on: minimum severity that FAILs the QA gate ("" = Trivy findings are
#   reported but never block; set to e.g. "CRITICAL" to hard-gate on it)
security:
  trivy:
    command: "trivy fs . --scanners vuln --severity CRITICAL,HIGH,MEDIUM,LOW"
    target: "."
    severities: "CRITICAL,HIGH,MEDIUM,LOW"
    scan_types: "vuln"
    fail_on: "" # advisory only (findings reported, never blocking)

# --- Commands ---
commands:
  build: "go build ./..."
  lint: "" # no separate lint tool configured (go vet runs inline via rules.review)
  format: "gofmt -w ./..."
  typecheck: "" # no separate typecheck tool (Go compilation covers it)

# --- Artifact layout (standard .skillgrid/ zones) ---
conventions:
  artifacts_root: .skillgrid
  scratch_dir: .skillgrid/sdd
  specs_dir: .skillgrid/specs
  archive_dir: .skillgrid/archive
  registry: docs/skillgrid/agents/skill-registry.md # optional; never a workflow gate

# --- Phase rules (preserved from the old skillgrid-sdd/v1 config) ---
rules:
  explore: []
  propose:
    - Include rollback plan for risky changes
    - Include success criteria (measurable)
    - Document architecture decisions with rationale (Choice/Alternatives/Rationale)
    - Carry applicable threat-matrix rows forward into spec scenarios + tasks RED-test tasks
    - Classify change (trivial | standard | risky; trivial may be one line) with verification floor L1-L4
    - Name trust boundaries + stop-and-ask security assumptions, or one line when none
    - Minimum secure design; label assumptions Verified / Inferred / Unknown
    - State falsifiable hypothesis (right + wrong conditions) with thinnest MVP and door check
    - Intent only in propose; engineering decisions belong to design/spec
  spec:
    - Map proposal Capabilities mechanically: New capability → full spec; Modified → delta spec (ADDED/MODIFIED/REMOVED/RENAMED)
    - MODIFIED is replace semantics: copy the ENTIRE requirement block, then edit (un-copied scenarios vanish at archive)
    - Requirements carry RFC 2119 keywords (uppercase); every requirement has Given/When/Then scenarios
    - Cover a happy path and at least one edge + failure per requirement
    - Every applicable design threat-matrix row gets a covering scenario (or a flagged gap)
    - REMOVED requires (Reason:) + (Migration:) where affected; RENAMED requires the {old} → {new} heading
  apply:
    guidelines:
      - Follow existing code patterns
      - Mark tasks [x] as you go (in tasks.md)
    tdd: false # selects the strict-TDD branch machinery, off by default; basic TDD (failing test before code) is always the baseline and is not toggled by this flag (see testing.tdd)
    test_command: "go test ./..."
  verify:
    test_command: "go test ./..."
    build_command: ""
    coverage_threshold: 80 # advisory only (WARNING at worst, never blocking)
  fast_track:
    enabled: true
    classes:
      trivial:
        criteria:
          - "single concern, ≤3 files, no behavior change (typo, copy, single-line config, pure rename)"
          - "no migration, no new dependency, no trust-boundary change"
        skips: [design, spec]
        tasks: light
        proposal: one-line
      small:
        criteria:
          - "single file or single concern, no new capability, no migration"
          - "≤10 files, 400-line budget risk Low"
        skips: [design, spec]
        tasks: light
        proposal: full
    waiver:
      required: true
      recorded_in: briefing.md
      carried_to: [tasks.md, report.md]
    blocked_when:
      - "any design threat-matrix row Applicable"
      - "400-line budget risk High"
      - "new trust boundary or migration"
      - "multi-domain spec impact"
    gates:
      user_gate: true
      verify: advisory-on-missing
      archive: intentional-partial
  review:
    - Fire requesting-code-review on high-risk signals (400-line risk High, chained PRs, applicable threat row, last step before archive)
    - Run quality-security-review advisory after verify passes (vet/gofmt/trivy + checklist); WARNING/SUGGESTION only, never blocking
    - Receive all findings via review-reception (verify against codebase first, one item at a time, pushback with evidence)
  archive:
    - Require every step in tasks.md to have PASS or PASS WITH WARNINGS before move
    - Advisory review findings (quality-security) recorded, do not block move
  # --- Rigor Tiers (match effort to risk) ---
  # The verification dial per change. T0 = prototype (self-check only),
  # T1 = alpha (light blueprint + verify), T2 = beta (default: full pipeline +
  # two-axis review), T3 = GA (mutation + security + parallel review with a
  # fresh-model reviewer). A per-change override in briefing.md (`Tier: T<n>`)
  # wins over the project default. Policy source:
  # .agents/skills/_shared/conventions/rigor-tiers.md
  tiers:
    default: T2
    T0: { name: Prototype, blueprint: none,  qa: self-check }
    T1: { name: Alpha,     blueprint: light, qa: L1+verify  }
    T2: { name: Beta,      blueprint: full,  qa: L2+L3,     review: two-axis }
    T3: { name: GA,        blueprint: full,  qa: L4,        review: parallel+fresh-model }

# --- BDD / Acceptance Testing ---
# Always on — BDD is non-negotiable in Skillgrid (like TDD). The
# skillgrid:acceptance-test-authoring skill and the acceptance-tests/ runner are
# always active: brainstorming writes .skillgrid/specs/<id>/acceptance.feature
# and execution enforces the spec zone rule (commit specs before code).
# stack: javascript (cucumber-js) — python/behave is a follow-up.
bdd:
  enabled: true
  stack: javascript
  specs_dir: .skillgrid/specs
  runner_dir: acceptance-tests
  lint: gherkin

# --- Mnemonic (persistent memory + code index + web cache) ---
# Detected at onboarding via the skillgrid CLI. When enabled, the
# skillgrid:mnemonic skill is active: mem_save for decisions, code_status
# → code_index → code_search for code orientation, web_cache for research.
# data_dir defaults to ~/.skillgrid/mnemonic; override if needed.
mnemonic:
  enabled: true
  data_dir: ~/.skillgrid/mnemonic

# --- Research ---
# Investigate a question against primary sources into a cited `## Research:`
# section at .skillgrid/specs/YYYY-MM-DD-<topic>/findings.md. Three skills:
# research (single inline pass), code-research (parallel fan-out + verify +
# red-team, for wide/high-stakes informational questions), and deep-research
# (long-horizon experimental research: hypothesis → experiment → measure loops
# with persistent state). Brainstorming dispatches research just-in-time when
# the design depends on a fact not in the codebase; writing-blueprints cites
# the findings.
research:
  default: research              # research | code-research
  output_dir: .skillgrid/specs
  code_research_preset: standard # quick | standard | deep

# --- Spike (feasibility probe) ---
# skillgrid:spike answers a falsifiable question with a VALIDATED / INVALIDATED /
# PARTIAL verdict + evidence. A tiny probe (one library, one command) is answered
# inline by brainstorming; a real probe (code executed, a comparison, a demo)
# delegates here. Both append their results to the topic's consolidated
# findings.md, which writing-blueprints reads.
spike:
  enabled: true
  findings: .skillgrid/specs/{topic}/findings.md   # consolidated per-topic file
  module_dir: .skillgrid/specs/{topic}/modules     # liftable pure modules (if any)

# --- Sketch (UI/interaction variant mockup) ---
# skillgrid:sketch builds 2-3 dramatic-difference interactive mockups for a design
# that has 2+ meaningfully different layout/interaction options. The marked
# winner + build constraints are appended to the topic's consolidated findings.md.
sketch:
  enabled: true
  findings: .skillgrid/specs/{topic}/findings.md   # consolidated per-topic file
  dir: .skillgrid/specs/{topic}/sketches           # HTML mockups + themes/
