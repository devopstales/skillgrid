# MCP servers to merge into each agent's config (kilo.jsonc, opencode.json)
# type: remote -> url; local -> command (first entry must be on PATH)
servers:
  context7:
    type: remote
    url: https://mcp.context7.com/mcp
  deepwiki:
    type: remote
    url: https://mcp.deepwiki.com/mcp
  engram:
    type: local
    command:
      - engram
      - mcp
  exa:
    type: remote
    url: https://mcp.exa.ai/mcp
  ccc:
    type: local
    command:
      - ccc
      - mcp
  gitnexus:
    type: local
    command:
      - npx
      - -y
      - gitnexus@1.3.11
      - mcp
  trivy:
    type: local
    command:
      - trivy
      - mcp
