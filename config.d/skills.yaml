# Installed via: npx skills add <repo> --agent amp -g -s '<skill>' -y
# Local skills (config.d/skills/) are discovered via skills.paths — no skills add needed.
skills:
  - repo: obra/superpowers
    skill: "*"
  # mnemonic-memory: local fork at config.d/skills/mnemonic-memory/ (default memory protocol)
  - repo: affaan-m/ecc
    skill: exa-search
  - repo: alirezarezvani/claude-skills
    skill: karpathy-coder
  - repo: szkocot/andrej-karpathy-skills
    skill: karpathy-guidelines
  - repo: aahl/skills
    skill: mcp-deepwiki
  - repo: microsoft/playwright-cli
    skill: playwright-cli
  - repo: currents-dev/playwright-best-practices-skill
    skill: playwright-best-practices
  - repo: vercel-labs/agent-browser
    skill: "*"

